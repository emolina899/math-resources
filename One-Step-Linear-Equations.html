<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One-Step Linear Equations Practice</title>
    <script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f1f5ff;padding:16px}main{max-width:650px;margin:auto;background:#151e32;border:1px solid #33415e;border-radius:20px;padding:22px;box-shadow:0 12px 35px #0003}body.light{background:#f5f7fc;color:#15213a;color-scheme:light}body.light main{background:white;border-color:#d9e0ed;box-shadow:0 12px 35px #15213a12}.top{display:flex;justify-content:flex-end}.toggle{border:1px solid #4a5a7b;background:#202e49;color:inherit;border-radius:999px;padding:9px 14px;cursor:pointer}body.light .toggle{background:#eef2fb;border-color:#ccd6e8}.hint{font-size:14px;color:#aebbd5;margin:18px 0 8px}body.light .hint{color:#566581}.equation{min-height:116px;display:flex;align-items:center;justify-content:center;font-size:31px;background:#10182b;border:1px solid #344463;border-radius:15px;padding:14px 8px;overflow-x:auto}body.light .equation{background:#f5f7fd;border-color:#d8e1f0}.answer{margin:20px 0 12px}label{display:block;font-weight:650;margin-bottom:9px}input{width:100%;background:#0e1729;color:inherit;border:1px solid #52617f;border-radius:12px;padding:14px 15px;font:inherit;font-size:18px;outline-offset:3px}body.light input{background:#fff;border-color:#aebbd0}input:focus{outline:2px solid #8f9eff}.help{font-size:13px;color:#aebbd5;margin:7px 0 0}body.light .help{color:#5c6880}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}button{font:inherit;font-weight:650;cursor:pointer;border-radius:11px;padding:12px 15px;border:1px solid #53617d;background:#273653;color:#f6f8ff}button.primary{background:#7776fa;border-color:#7776fa;color:#fff}body.light button:not(.primary):not(.toggle){background:#f2f5fb;color:#233451;border-color:#cbd5e5}button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}.feedback{margin-top:17px;border-radius:12px;padding:14px;line-height:1.55;background:#26314a;border:1px solid #45577a}.feedback.good{background:#123d36;border-color:#237967}.feedback.bad{background:#4a2832;border-color:#9e4b60}body.light .feedback{background:#f0f3fc;border-color:#cbd5e5}body.light .feedback.good{background:#e7f7ef;border-color:#83c6a2}body.light .feedback.bad{background:#fff0f1;border-color:#e5a7b0}.solution{margin-top:14px;background:#10182b;border:1px solid #344463;border-radius:12px;padding:15px;line-height:1.8}body.light .solution{background:#f7f9ff;border-color:#d8e1f0}.solution strong{display:block;margin-bottom:8px}.solution .step{padding:7px 0;border-bottom:1px solid #ffffff18}.solution .step:last-child{border-bottom:0}.hidden{display:none!important}@media(max-width:430px){main{padding:15px}.equation{font-size:25px}.buttons button{flex:1 1 44%}}
</style>
  </head>
  <body>
    <main>
      <div class="top">
        <button id="theme" class="toggle" type="button">☀ Light mode</button>
      </div>
      <p class="hint">Solve the equation for \(x\).</p>
      <div class="equation" id="equation" aria-live="polite">
      </div>
      <div class="answer">
        <label for="answer">Your answer</label>
        <input id="answer" autocomplete="off" inputmode="text" placeholder="Enter an integer or simplified fraction" aria-describedby="help">
        <p class="help" id="help">Use a fraction such as -3/4 when needed. Decimals are not accepted.</p>
      </div>
      <div class="buttons">
        <button class="primary" id="submit" type="button">Submit</button>
        <button id="similar" type="button">Try Similar</button>
        <button id="solutionBtn" type="button">Show Solution</button>
      </div>
      <div id="feedback" class="feedback hidden" role="status" aria-live="polite">
      </div>
      <div id="solution" class="solution hidden" aria-live="polite">
      </div>
    </main>
    <script>
(()=>{'use strict';
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function rat(n,d=1){if(d<0){n=-n;d=-d}let g=gcd(n,d);return {n:n/g,d:d/g}}
function tex(r){return r.d===1?String(r.n):(r.n<0?'-':'')+'\\frac{'+Math.abs(r.n)+'}{'+r.d+'}'}
function plain(r){return r.d===1?String(r.n):r.n+'/'+r.d}
function pickAnswer(){if(Math.random()<.55)return rat(rand(-12,12));let d=rand(2,9),n=rand(-18,18);if(!n)n=1;while(gcd(n,d)!==1||n%d===0)n=rand(-18,18)||1;return rat(n,d)}
let current;
function generate(){let op=rand(0,3),x=pickAnswer(),a=rand(2,12),b=rand(1,15),lhs='',rhs='',steps=[];
if(op===0){let k=rand(-12,12);lhs='x'+(k>=0?' + '+k:' - '+(-k));rhs=tex(rat(x.n+k*x.d,x.d));steps=[`Subtract \\(${k}\\) from both sides.`,`\\[x=${rhs}-${k}=${tex(x)}\\]`];}
if(op===1){let k=rand(-12,12);lhs='x'+(k>=0?' - '+k:' + '+(-k));rhs=tex(rat(x.n-k*x.d,x.d));steps=[`Add \\(${k}\\) to both sides.`,`\\[x=${rhs}+${k}=${tex(x)}\\]`];}
if(op===2){let k=a*(Math.random()<.5?-1:1);lhs=k===1?'x':k===-1?'-x':k+'x';rhs=tex(rat(x.n*k,x.d));steps=[`Divide both sides by \\(${k}\\).`,`\\[x=\\frac{${rhs}}{${k}}=${tex(x)}\\]`];}
if(op===3){let k=a*(Math.random()<.5?-1:1);lhs='\\frac{x}{'+k+'}';rhs=tex(rat(x.n,x.d*k));steps=[`Multiply both sides by \\(${k}\\).`,`\\[x=${k}\\left(${rhs}\\right)=${tex(x)}\\]`];}
current={x,eq:'\\['+lhs+' = '+rhs+'\\]',steps};$('equation').textContent=current.eq;$('answer').value='';$('feedback').className='feedback hidden';$('solution').className='solution hidden';$('solution').innerHTML='';$('solutionBtn').textContent='Show Solution';typeset();}
function typeset(){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([$('equation'),$('solution')]).catch(()=>{})}}
function parseAnswer(s){s=s.trim().replace(/\s+/g,'');if(!/^[+-]?\d+(?:\/[+-]?\d+)?$/.test(s))return null;let parts=s.split('/'),n=Number(parts[0]),d=parts.length===2?Number(parts[1]):1;if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d===0)return null;let r=rat(n,d);return {n,d,r,simplified:n===r.n&&d===r.d}}
function submit(){let p=parseAnswer($('answer').value),f=$('feedback');f.className='feedback';if(!p){f.classList.add('bad');f.textContent='Enter an integer or a fraction such as -3/4. Decimals and expressions are not accepted.';return}if(!p.simplified){f.classList.add('bad');f.textContent='Reduce your fraction to simplest form before submitting.';return}if(p.r.n===current.x.n&&p.r.d===current.x.d){f.classList.add('good');f.textContent='Correct! The solution is '+plain(current.x)+'.'}else{f.classList.add('bad');f.textContent='Not quite. Check your inverse operation and try again.'}}
function showSolution(){let s=$('solution');if(!s.classList.contains('hidden')){s.classList.add('hidden');$('solutionBtn').textContent='Show Solution';return}s.innerHTML='<strong>Step-by-step solution</strong>'+current.steps.map(t=>'<div class="step">'+t+'</div>').join('');s.classList.remove('hidden');$('solutionBtn').textContent='Hide Solution';typeset()}
$('submit').addEventListener('click',submit);$('similar').addEventListener('click',generate);$('solutionBtn').addEventListener('click',showSolution);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('theme').addEventListener('click',()=>{let light=document.body.classList.toggle('light');$('theme').textContent=light?'☾ Dark mode':'☀ Light mode'});generate();
})();
</script>
  </body>
</html>
