
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solving Proportions</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']]
  },
  svg: { fontCache: 'global' }
};
</script>
<script defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #101827;
  --panel: #1d2b46;
  --field: #192840;
  --text: #f5f7ff;
  --muted: #b9c6dc;
  --border: #40577d;
  --accent: #8b70ff;
  --soft: #2b4064;
  --good: #86e6b3;
  --bad: #ff9eaa;
}

body.light {
  --bg: #ffffff;
  --panel: #f0f2ff;
  --field: #ffffff;
  --text: #19243b;
  --muted: #56647b;
  --border: #c4cee3;
  --accent: #6554e9;
  --soft: #e4e9f6;
  --good: #17734c;
  --bad: #b82c46;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px Arial, sans-serif;
  padding: 10px;
  transition: background .2s, color .2s;
}

.app {
  max-width: 780px;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  font-size: 14px;
  font-weight: 600;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font: inherit;
  font-weight: bold;
  transition: filter .2s;
}

button:hover { filter: brightness(1.08); }

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.theme {
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 8px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.panel {
  background: linear-gradient(130deg, var(--panel), var(--field));
  border: 1px solid var(--accent);
  border-radius: 15px;
  min-height: 125px;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.equation {
  font-size: 28px;
  width: 100%;
}

.solution {
  display: none;
  width: 100%;
  line-height: 1.5;
  font-size: 15px;
}

.solution-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--muted);
  margin-bottom: 12px;
}

.solution-step { margin: 10px 0; }

.final {
  color: var(--good);
  font-size: 20px;
  font-weight: bold;
  margin-top: 12px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 12px 0 7px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--field);
  color: var(--text);
  font: inherit;
}

input::placeholder { color: var(--muted); }

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

.submit {
  color: white;
  background: linear-gradient(110deg, #935bf6, #6359ec);
}

.next {
  color: white;
  background: linear-gradient(110deg, #365f9c, #274675);
}

.reveal {
  display: block;
  width: 100%;
  margin-top: 9px;
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  text-align: center;
  min-height: 20px;
  margin-top: 9px;
  font-weight: bold;
  font-size: 13px;
}

.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

@media(max-width: 420px) {
  body { padding: 7px; }
  .panel { min-height: 110px; padding: 12px; }
  .equation { font-size: 23px; }
  .prompt { font-size: 13px; }
  button { font-size: 13px; padding: 10px; }
}
</style>
</head>

<body>
<main class="app">

  <div class="top">
    <span class="prompt">
      Solve the following proportion for x.
    </span>

    <button id="theme" class="theme" type="button">
      ☀ Light mode
    </button>
  </div>

  <section class="panel">
    <div id="equation" class="equation"></div>
    <div id="solution" class="solution"></div>
  </section>

  <label for="answer">Your answer</label>

  <input id="answer" type="text"
    placeholder="Enter an integer or simplified fraction"
    autocomplete="off"
    spellcheck="false">

  <div class="actions">
    <button id="submit" class="submit" type="button">
      Submit
    </button>

    <button id="next" class="next" type="button">
      Try Similar
    </button>
  </div>

  <button id="reveal" class="reveal" type="button">
    Show Answer
  </button>

  <div id="feedback" class="feedback"
    aria-live="polite"></div>

</main>

<script>
"use strict";

const el = id => document.getElementById(id);

function rand(min, max) {
  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;
}

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);

  while (b !== 0) {
    const t = b;
    b = a % b;
    a = t;
  }

  return a || 1;
}

function reduce(n, d) {
  if (d < 0) {
    n = -n;
    d = -d;
  }

  const g = gcd(n, d);

  return { n: n / g, d: d / g };
}

function signedNumber() {
  const value = rand(2, 18);
  return Math.random() < 0.30 ? -value : value;
}

function latexAnswer(f) {
  if (f.d === 1) return String(f.n);

  const sign = f.n < 0 ? "-" : "";

  return sign + "\\frac{" +
    Math.abs(f.n) + "}{" + f.d + "}";
}

function wrapMath(s) {
  return "\\(" + s + "\\)";
}

// Generate 50 unique problems.
// Positions are assigned in a repeating 0,1,2,3 pattern.

const problems = [];
const seen = new Set();

for (let i = 0; i < 50; i++) {
  let p, key;

  do {
    const a = signedNumber();
    const b = signedNumber();
    const c = signedNumber();
    const d = signedNumber();

    const position = i % 4;

    let numerator, denominator;

    if (position === 0) {
      numerator = b * c;
      denominator = d;
    } else if (position === 1) {
      numerator = a * d;
      denominator = c;
    } else if (position === 2) {
      numerator = a * d;
      denominator = b;
    } else {
      numerator = b * c;
      denominator = a;
    }

    p = {
      a, b, c, d,
      position,
      answer: reduce(numerator, denominator)
    };

    key = [a, b, c, d, position].join(",");

  } while (seen.has(key));

  seen.add(key);
  problems.push(p);
}

let currentIndex = -1;
let showingSolution = false;
let nextPosition = -1;

function equationLatex(p) {
  const A = p.position === 0 ? "x" : String(p.a);
  const B = p.position === 1 ? "x" : String(p.b);
  const C = p.position === 2 ? "x" : String(p.c);
  const D = p.position === 3 ? "x" : String(p.d);

  return "\\frac{" + A + "}{" + B + "}" +
    "=\\frac{" + C + "}{" + D + "}";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([
      el("equation"),
      el("solution")
    ]).catch(console.error);
  }
}

function newProblem() {
  // Move x to a different position every time.
  nextPosition = (nextPosition + 1) % 4;

  const matching = [];

  for (let i = 0; i < problems.length; i++) {
    if (problems[i].position === nextPosition) {
      matching.push(i);
    }
  }

  const randomIndex = rand(0, matching.length - 1);
  currentIndex = matching[randomIndex];

  showingSolution = false;

  const p = problems[currentIndex];

  el("equation").style.display = "block";
  el("solution").style.display = "none";

  el("equation").textContent =
    wrapMath(equationLatex(p));

  el("solution").innerHTML = "";
  el("reveal").textContent = "Show Answer";

  el("answer").value = "";
  el("feedback").textContent = "";
  el("feedback").className = "feedback";

  typeset();
}

function checkAnswer() {
  const input = el("answer").value
    .trim()
    .replace(/\s+/g, "");

  const feedback = el("feedback");

  const match = input.match(
    /^([+-]?\d+)(?:\/([+-]?\d+))?$/
  );

  if (!match) {
    feedback.textContent =
      "Enter an integer or simplified fraction.";
    feedback.className = "feedback bad";
    return;
  }

  const n = Number(match[1]);
  const d = match[2] === undefined
    ? 1
    : Number(match[2]);

  if (
    !Number.isSafeInteger(n) ||
    !Number.isSafeInteger(d) ||
    d === 0
  ) {
    feedback.textContent =
      "Enter a valid integer or fraction.";
    feedback.className = "feedback bad";
    return;
  }

  if (d < 0 || gcd(n, d) !== 1) {
    feedback.textContent =
      "Simplify your fraction and use a positive denominator.";
    feedback.className = "feedback bad";
    return;
  }

  const correct = problems[currentIndex].answer;

  if (n === correct.n && d === correct.d) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback good";
  } else {
    feedback.textContent = "Not quite. Try again.";
    feedback.className = "feedback bad";
  }
}

function toggleSolution() {
  showingSolution = !showingSolution;

  if (!showingSolution) {
    el("solution").style.display = "none";
    el("equation").style.display = "block";
    el("reveal").textContent = "Show Answer";
    return;
  }

  const p = problems[currentIndex];

  let coefficient, factor1, factor2;

  if (p.position === 0) {
    coefficient = p.d;
    factor1 = p.b;
    factor2 = p.c;
  } else if (p.position === 1) {
    coefficient = p.c;
    factor1 = p.a;
    factor2 = p.d;
  } else if (p.position === 2) {
    coefficient = p.b;
    factor1 = p.a;
    factor2 = p.d;
  } else {
    coefficient = p.a;
    factor1 = p.b;
    factor2 = p.c;
  }

  const product = factor1 * factor2;

  const step1 =
    coefficient + "x=(" + factor1 +
    ")(" + factor2 + ")";

  const step2 = coefficient + "x=" + product;

  const step3 =
    "x=\\frac{" + product +
    "}{" + coefficient + "}";

  const finalAnswer =
    "x=" + latexAnswer(p.answer);

  el("equation").style.display = "none";
  el("solution").style.display = "block";

  el("solution").innerHTML =
    '<div class="solution-title">' +
      'Answer and solution' +
    '</div>' +

    '<div class="solution-step">' +
      wrapMath(equationLatex(p)) +
    '</div>' +

    '<div class="solution-step">Cross multiply:</div>' +

    '<div class="solution-step">' +
      wrapMath(step1) +
    '</div>' +

    '<div class="solution-step">' +
      wrapMath(step2) +
    '</div>' +

    '<div class="solution-step">Divide by ' +
      coefficient + ':</div>' +

    '<div class="solution-step">' +
      wrapMath(step3) +
    '</div>' +

    '<div class="final">' +
      wrapMath(finalAnswer) +
    '</div>';

  el("reveal").textContent = "Hide Answer";
  typeset();
}

el("theme").addEventListener("click", () => {
  const light = document.body.classList.toggle("light");

  el("theme").textContent = light
    ? "☾ Dark mode"
    : "☀ Light mode";
});

el("submit").addEventListener("click", checkAnswer);
el("next").addEventListener("click", newProblem);
el("reveal").addEventListener("click", toggleSolution);

el("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});

newProblem();
</script>
</body>
</html>
