
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solving Proportions</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #101827;
  --panel: #1b2943;
  --field: #17243b;
  --text: #f5f7ff;
  --muted: #b9c6dc;
  --border: #3d5075;
  --accent: #8066ff;
  --button: #293d60;
  --success: #7ce6b0;
  --error: #ff9da9;
}

body.light {
  --bg: #ffffff;
  --panel: #eef2fc;
  --field: #ffffff;
  --text: #17233b;
  --muted: #56647b;
  --border: #c5cfe1;
  --accent: #6255df;
  --button: #e2e8f5;
  --success: #16764b;
  --error: #bd3045;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
  padding: 10px;
  transition: background .2s, color .2s;
}

.activity {
  max-width: 780px;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  font-size: 14px;
  font-weight: 600;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.1);
}

.theme-btn {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.math-panel {
  background: linear-gradient(135deg, var(--panel), var(--field));
  border: 1px solid var(--accent);
  border-radius: 14px;
  min-height: 120px;
  padding: 16px 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.equation {
  width: 100%;
  font-size: 27px;
}

.solution {
  display: none;
  width: 100%;
  font-size: 15px;
  line-height: 1.6;
}

.solution-title {
  font-weight: bold;
  color: var(--muted);
  margin-bottom: 10px;
}

.solution-step {
  margin: 9px 0;
}

.answer-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 12px 0 6px;
}

input {
  width: 100%;
  padding: 12px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font: inherit;
}

input::placeholder {
  color: var(--muted);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

.primary {
  background: linear-gradient(120deg, #8c5cf5, #6258eb);
  color: white;
}

.secondary {
  background: linear-gradient(120deg, #335b98, #254578);
  color: white;
}

.solution-btn {
  display: block;
  width: 100%;
  margin-top: 9px;
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  min-height: 18px;
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.correct { color: var(--success); }
.incorrect { color: var(--error); }

@media(max-width: 420px) {
  body { padding: 7px; }
  .math-panel { min-height: 105px; padding: 12px 8px; }
  .equation { font-size: 23px; }
  button { padding: 10px 8px; font-size: 13px; }
  .theme-btn { font-size: 11px; }
}
</style>
</head>

<body>
<div class="activity">

  <div class="top">
    <span class="prompt">
      Solve the following proportion for x.
    </span>

    <button id="themeBtn" class="theme-btn"
      type="button" onclick="toggleTheme()">
      ☀ Light mode
    </button>
  </div>

  <div class="math-panel">
    <div id="equation" class="equation"></div>
    <div id="solution" class="solution"></div>
  </div>

  <label class="answer-label" for="answer">
    Your answer
  </label>

  <input id="answer" type="text"
    placeholder="Enter an integer or simplified fraction"
    autocomplete="off"
    spellcheck="false">

  <div class="actions">
    <button class="primary" type="button"
      onclick="checkAnswer()">Submit</button>

    <button class="secondary" type="button"
      onclick="newProblem()">Try Similar</button>
  </div>

  <button class="solution-btn" id="solutionBtn"
    type="button" onclick="toggleSolution()">
    Show Answer
  </button>

  <div class="feedback" id="feedback"
    aria-live="polite"></div>

</div>

<script>
const $ = id => document.getElementById(id);

let problems = [];
let currentIndex = -1;
let currentProblem = null;
let showingSolution = false;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);

  while (b !== 0) {
    const t = b;
    b = a % b;
    a = t;
  }

  return a || 1;
}

function simplify(n, d) {
  const g = gcd(n, d);

  return {
    n: n / g,
    d: d / g
  };
}

function texFraction(n, d) {
  const f = simplify(n, d);

  if (f.d === 1) return String(f.n);

  return "\\frac{" + f.n + "}{" + f.d + "}";
}

function math(s) {
  return "\\(" + s + "\\)";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(console.error);
  }
}

function generateProblems() {
  problems = [];
  const used = new Set();

  while (problems.length < 50) {
    const a = rand(2, 15);
    const b = rand(3, 20);
    const d = rand(2, 20);

    if (a === b || b === d) continue;

    const key = a + "-" + b + "-" + d;

    if (used.has(key)) continue;

    used.add(key);

    problems.push({
      a: a,
      b: b,
      d: d,
      answer: simplify(a * d, b)
    });
  }
}

function newProblem() {
  if (problems.length === 0) {
    generateProblems();
  }

  let index;

  do {
    index = rand(0, problems.length - 1);
  } while (index === currentIndex && problems.length > 1);

  currentIndex = index;
  currentProblem = problems[index];
  showingSolution = false;

  const p = currentProblem;

  $("equation").style.display = "block";
  $("solution").style.display = "none";

  $("equation").innerHTML = math(
    "\\frac{" + p.a + "}{" + p.b + "}" +
    "=" +
    "\\frac{x}{" + p.d + "}"
  );

  $("solution").innerHTML = "";
  $("solutionBtn").textContent = "Show Answer";
  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  typeset();
}

function checkAnswer() {
  const value = $("answer").value.trim().replace(/\s+/g, "");
  const feedback = $("feedback");

  let n, d;

  if (/^-?\d+$/.test(value)) {
    n = Number(value);
    d = 1;
  } else {
    const match = value.match(/^(-?\d+)\/(\d+)$/);

    if (!match) {
      feedback.textContent =
        "Enter an integer or simplified fraction.";
      feedback.className = "feedback incorrect";
      return;
    }

    n = Number(match[1]);
    d = Number(match[2]);

    if (d === 0 || gcd(n, d) !== 1) {
      feedback.textContent =
        "Enter your fraction in simplified form.";
      feedback.className = "feedback incorrect";
      return;
    }
  }

  const correct = currentProblem.answer;

  if (n === correct.n && d === correct.d) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
  } else {
    feedback.textContent = "Not quite. Try again.";
    feedback.className = "feedback incorrect";
  }
}

function toggleSolution() {
  showingSolution = !showingSolution;

  if (showingSolution) {
    const p = currentProblem;
    const product = p.a * p.d;

    $("equation").style.display = "none";
    $("solution").style.display = "block";

    $("solution").innerHTML =
      '<div class="solution-title">Answer and solution</div>' +

      '<div class="solution-step">' +
      math("\\frac{" + p.a + "}{" + p.b + "}" +
           "=\\frac{x}{" + p.d + "}") +
      '</div>' +

      '<div class="solution-step">Cross multiply:</div>' +

      '<div class="solution-step">' +
      math(p.b + "x=" + p.a + "\\cdot" + p.d) +
      '</div>' +

      '<div class="solution-step">' +
      math(p.b + "x=" + product) +
      '</div>' +

      '<div class="solution-step">Divide by ' + p.b + ':</div>' +

      '<div class="solution-step">' +
      math("x=\\frac{" + product + "}{" + p.b + "}") +
      '</div>' +

      '<div class="solution-step"><strong>' +
      math("x=" + texFraction(product, p.b)) +
      '</strong></div>';

    $("solutionBtn").textContent = "Hide Answer";
    typeset();

  } else {
    $("equation").style.display = "block";
    $("solution").style.display = "none";
    $("solutionBtn").textContent = "Show Answer";
  }
}

function toggleTheme() {
  const light = document.body.classList.toggle("light");

  $("themeBtn").textContent =
    light ? "☾ Dark mode" : "☀ Light mode";
}

$("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});

generateProblems();
newProblem();
</script>
</body>
</html>
