
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solving Proportions</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  },
  svg: { fontCache: 'global' }
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101827;
  --panel: #1b2943;
  --field: #17243b;
  --text: #f5f7ff;
  --muted: #b9c6dc;
  --border: #3d5075;
  --accent: #8066ff;
  --button: #293d60;
  --success: #7ce6b0;
  --error: #ff9da9;
}

body.light {
  --bg: #ffffff;
  --panel: #eef2fc;
  --field: #ffffff;
  --text: #17233b;
  --muted: #56647b;
  --border: #c5cfe1;
  --accent: #6255df;
  --button: #e2e8f5;
  --success: #16764b;
  --error: #bd3045;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
  padding: 10px;
  transition: background .2s, color .2s;
}

.activity {
  max-width: 780px;
  margin: auto;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
}

.theme-btn {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.math-panel {
  background: linear-gradient(
    135deg,
    var(--panel),
    var(--field)
  );
  border: 1px solid var(--accent);
  border-radius: 14px;
  min-height: 120px;
  padding: 16px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.equation {
  width: 100%;
  font-size: 27px;
}

.answer-reveal {
  display: none;
  width: 100%;
  line-height: 1.6;
  text-align: center;
  font-size: 16px;
}

.answer-title {
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}

.answer-step {
  margin: 8px 0;
}

.answer-label {
  display: block;
  margin: 12px 0 6px;
  font-size: 13px;
  font-weight: bold;
}

input {
  display: block;
  width: 100%;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font: inherit;
}

input::placeholder {
  color: var(--muted);
}

input:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  transition: filter .2s, transform .15s;
}

button:hover {
  filter: brightness(1.1);
}

button:active {
  transform: scale(.98);
}

.primary {
  background: linear-gradient(
    120deg,
    #8c5cf5,
    #6258eb
  );
  color: white;
}

.secondary {
  background: linear-gradient(
    120deg,
    #335b98,
    #254578
  );
  color: white;
}

.answer-btn {
  display: block;
  width: 100%;
  margin-top: 9px;
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  min-height: 18px;
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.correct {
  color: var(--success);
}

.incorrect {
  color: var(--error);
}

@media(max-width: 420px) {
  body {
    padding: 7px;
  }

  .math-panel {
    min-height: 105px;
    padding: 12px 8px;
  }

  .equation {
    font-size: 23px;
  }

  button {
    padding: 10px 8px;
    font-size: 13px;
  }

  .theme-btn {
    font-size: 11px;
  }

  input {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="activity">

  <div class="top">
    <span class="prompt">
      Solve the following proportion for x.
    </span>

    <button
      id="themeBtn"
      class="theme-btn"
      type="button"
      onclick="toggleTheme()">
      ☀ Light mode
    </button>
  </div>

  <div class="math-panel">
    <div id="equation" class="equation"></div>
    <div id="answerReveal" class="answer-reveal"></div>
  </div>

  <label class="answer-label" for="answer">
    Your answer
  </label>

  <input
    id="answer"
    type="text"
    placeholder="Enter an integer or simplified fraction"
    autocomplete="off"
    spellcheck="false">

  <div class="actions">
    <button
      class="primary"
      type="button"
      onclick="checkAnswer()">
      Submit
    </button>

    <button
      class="secondary"
      type="button"
      onclick="newProblem()">
      Try Similar
    </button>
  </div>

  <button
    class="answer-btn"
    id="answerBtn"
    type="button"
    onclick="toggleAnswer()">
    Show Answer
  </button>

  <div
    id="feedback"
    class="feedback"
    aria-live="polite">
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

let currentProblem = null;
let showingAnswer = false;
let previousIndex = -1;

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);

  while (b !== 0) {
    const t = b;
    b = a % b;
    a = t;
  }

  return a || 1;
}

function simplify(n, d) {
  if (d < 0) {
    n = -n;
    d = -d;
  }

  const g = gcd(n, d);

  return {
    n: n / g,
    d: d / g
  };
}

function texFraction(n, d) {
  const f = simplify(n, d);

  if (f.d === 1) {
    return String(f.n);
  }

  const sign = f.n < 0 ? "-" : "";

  return sign + "\\frac{" +
    Math.abs(f.n) + "}{" + f.d + "}";
}

function math(s) {
  return "\\(" + s + "\\)";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(console.error);
  }
}

function clearMath() {
  if (window.MathJax && MathJax.typesetClear) {
    MathJax.typesetClear([
      $("equation"),
      $("answerReveal")
    ]);
  }
}

/*
  Generate exactly 50 unique problem templates.

  Each proportion has the form:

       a       x
      ---  =  ---
       b       d

  The answer is x = ad/b.

  We use a set to prevent duplicate equations.
*/

const problems = [];
const seen = new Set();

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

while (problems.length < 50) {
  const a = randomInt(2, 15);
  const b = randomInt(3, 20);
  const d = randomInt(2, 20);

  // Avoid identical denominators and trivial ratios.
  if (a === b || b === d) continue;

  const key = `${a}/${b}=${d}`;

  if (!seen.has(key)) {
    seen.add(key);
    problems.push({ a, b, d });
  }
}

    if (problems.length >= 50) break;
  }

  if (problems.length >= 50) break;
}

function newProblem() {
  let index;

  do {
    index = Math.floor(
      Math.random() * problems.length
    );
  } while (
    index === previousIndex &&
    problems.length > 1
  );

  previousIndex = index;

  const p = problems[index];

  currentProblem = {
    ...p,
    answer: simplify(p.a * p.d, p.b)
  };

  showingAnswer = false;

  clearMath();

  $("equation").style.display = "block";
  $("answerReveal").style.display = "none";

  $("equation").innerHTML = math(
    "\\frac{" + p.a + "}{" + p.b + "}" +
    "=" +
    "\\frac{x}{" + p.d + "}"
  );

  $("answerReveal").innerHTML = "";
  $("answerBtn").textContent = "Show Answer";

  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  typeset();
}

function parseAnswer(value) {
  const s = value.trim().replace(/\s+/g, "");

  if (/^[+-]?\d+$/.test(s)) {
    const n = Number(s);

    if (!Number.isSafeInteger(n)) {
      return { valid: false };
    }

    return {
      ...simplify(n, 1),
      valid: true
    };
  }

  const match = s.match(
    /^([+-]?\d+)\/([+-]?\d+)$/
  );

  if (!match) {
    return { valid: false };
  }

  const n = Number(match[1]);
  const d = Number(match[2]);

  if (
    !Number.isSafeInteger(n) ||
    !Number.isSafeInteger(d) ||
    d === 0
  ) {
    return { valid: false };
  }

  if (d < 0 || gcd(n, d) !== 1) {
    return {
      valid: false,
      simplify: true
    };
  }

  return {
    ...simplify(n, d),
    valid: true
  };
}

function checkAnswer() {
  const result = parseAnswer($("answer").value);
  const feedback = $("feedback");

  if (!result.valid) {
    feedback.textContent = result.simplify
      ? "Enter your answer in simplified form."
      : "Enter an integer or simplified fraction.";

    feedback.className = "feedback incorrect";
    return;
  }

  if (
    result.n === currentProblem.answer.n &&
    result.d === currentProblem.answer.d
  ) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
  } else {
    feedback.textContent =
      "Not quite. Try again.";

    feedback.className = "feedback incorrect";
  }
}

function toggleAnswer() {
  showingAnswer = !showingAnswer;

  if (showingAnswer) {
    clearMath();

    const p = currentProblem;
    const product = p.a * p.d;

    $("equation").style.display = "none";
    $("answerReveal").style.display = "block";

    $("answerReveal").innerHTML =
      '<div class="answer-title">' +
      'Answer and solution' +
      '</div>' +

      '<div class="answer-step">' +
      math(
        "\\frac{" + p.a + "}{" + p.b + "}" +
        "=" +
        "\\frac{x}{" + p.d + "}"
      ) +
      '</div>' +

      '<div class="answer-step">' +
      'Cross multiply:' +
      '</div>' +

      '<div class="answer-step">' +
      math(
        p.b + "x=" + p.a +
        "\\cdot" + p.d
      ) +
      '</div>' +

      '<div class="answer-step">' +
      math(
        p.b + "x=" + product
      ) +
      '</div>' +

      '<div class="answer-step">' +
      'Divide by ' + p.b + ':' +
      '</div>' +

      '<div class="answer-step">' +
      math(
        "x=\\frac{" + product +
        "}{" + p.b + "}"
      ) +
      '</div>' +

      '<div class="answer-step"><strong>' +
      math(
        "x=" + texFraction(product, p.b)
      ) +
      '</strong></div>';

    $("answerBtn").textContent = "Hide Answer";

    typeset();

  } else {
    $("equation").style.display = "block";
    $("answerReveal").style.display = "none";
    $("answerBtn").textContent = "Show Answer";
  }
}

function toggleTheme() {
  const light = document.body.classList.toggle("light");

  $("themeBtn").textContent =
    light ? "☾ Dark mode" : "☀ Light mode";
}

$("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    checkAnswer();
  }
});

newProblem();
</script>

</body>
</html>
