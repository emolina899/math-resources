
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101827;
  --panel: #192743;
  --field: #16243b;
  --text: #f5f7ff;
  --muted: #b8c6de;
  --border: #3b5279;
  --button: #293d60;
  --accent: #7367f5;
  --success: #7ce6b0;
  --error: #ff9aab;
}

body.light {
  --bg: #ffffff;
  --panel: #f0f3ff;
  --field: #ffffff;
  --text: #1b2540;
  --muted: #56637b;
  --border: #c4cdea;
  --button: #e2e8f7;
  --accent: #6254e5;
  --success: #15764c;
  --error: #bd3045;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 10px;
  transition: background .2s, color .2s;
}

.activity {
  max-width: 780px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

button {
  border: none;
  border-radius: 10px;
  padding: 11px 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: filter .2s, transform .15s;
}

button:hover {
  filter: brightness(1.12);
}

button:active {
  transform: scale(.98);
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.theme-btn {
  background: var(--button);
  color: var(--text);
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 20px;
}

.math-panel {
  background: linear-gradient(
    135deg,
    var(--panel),
    var(--field)
  );
  border: 1px solid var(--accent);
  border-radius: 14px;
  min-height: 105px;
  padding: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: inset 0 0 22px rgba(110, 95, 240, .08);
}

.equation {
  width: 100%;
  font-size: 25px;
  font-weight: 600;
}

.solution {
  width: 100%;
  font-size: 14px;
  line-height: 1.4;
}

.solution-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 7px;
}

.solution-step {
  margin: 5px 0;
}

.answer-label {
  display: block;
  margin: 12px 0 6px;
  font-size: 13px;
  font-weight: 700;
}

input {
  display: block;
  width: 100%;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font: inherit;
}

input:focus {
  border-color: var(--accent);
  outline: 2px solid rgba(115, 103, 245, .2);
}

input::placeholder {
  color: var(--muted);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

.primary {
  background: linear-gradient(
    120deg,
    #8c5cf5,
    #6258eb
  );
  color: white;
  box-shadow: 0 3px 10px rgba(100, 80, 235, .2);
}

.secondary {
  background: linear-gradient(
    120deg,
    #335b98,
    #254578
  );
  color: white;
}

.solution-btn {
  width: 100%;
  margin-top: 9px;
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  margin-top: 7px;
  min-height: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
}

.correct {
  color: var(--success);
}

.incorrect {
  color: var(--error);
}

@media (max-width: 420px) {
  body {
    padding: 7px;
  }

  .prompt {
    font-size: 13px;
  }

  .math-panel {
    min-height: 90px;
    padding: 10px;
  }

  .equation {
    font-size: 21px;
  }

  button {
    padding: 10px 8px;
    font-size: 13px;
  }

  .theme-btn {
    font-size: 11px;
  }

  input {
    font-size: 14px;
  }
}
</style>
