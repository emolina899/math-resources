
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Step Linear Equations</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>
<script defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101827;
  --panel: #1b2943;
  --field: #17243b;
  --text: #f5f7ff;
  --muted: #b9c6dc;
  --border: #3d5075;
  --button: #293d60;
  --accent: #7367f5;
  --success: #7ce6b0;
  --error: #ff9da9;
}

body.light {
  --bg: #ffffff;
  --panel: #eef2fc;
  --field: #ffffff;
  --text: #17233b;
  --muted: #56647b;
  --border: #c5cfe1;
  --button: #e2e8f5;
  --accent: #6255df;
  --success: #16764b;
  --error: #bd3045;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
  padding: 10px;
  transition: background .2s, color .2s;
}

.activity {
  max-width: 780px;
  margin: auto;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: filter .2s, transform .15s;
}

button:hover {
  filter: brightness(1.1);
}

button:active {
  transform: scale(.98);
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.theme-btn {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.math-panel {
  background: linear-gradient(
    135deg,
    var(--panel),
    var(--field)
  );
  border: 1px solid var(--accent);
  border-radius: 14px;
  min-height: 105px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: inset 0 0 22px rgba(110,95,240,.08);
}

.equation {
  width: 100%;
  font-size: 24px;
}

.solution {
  width: 100%;
  font-size: 14px;
  line-height: 1.45;
}

.solution-title {
  color: var(--muted);
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 8px;
}

.solution-step {
  margin: 6px 0;
}

.answer-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 12px 0 6px;
}

input {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font: inherit;
}

input::placeholder {
  color: var(--muted);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

.primary {
  background: linear-gradient(
    120deg,
    #8c5cf5,
    #6258eb
  );
  color: #ffffff;
}

.secondary {
  background: linear-gradient(
    120deg,
    #335b98,
    #254578
  );
  color: #ffffff;
}

.solution-btn {
  display: block;
  width: 100%;
  margin-top: 9px;
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  margin-top: 8px;
  min-height: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.correct {
  color: var(--success);
}

.incorrect {
  color: var(--error);
}

@media (max-width: 420px) {
  body {
    padding: 7px;
  }

  .math-panel {
    min-height: 95px;
    padding: 10px;
  }

  .equation {
    font-size: 21px;
  }

  button {
    padding: 10px 8px;
    font-size: 13px;
  }

  .theme-btn {
    font-size: 11px;
  }

  input {
    font-size: 14px;
  }
}
</style>
</head>

<body>
<div class="activity">

  <div class="top">
    <span class="prompt">Solve the equation for x.</span>
    <button class="theme-btn" id="themeBtn"
      type="button" onclick="toggleTheme()">
      Light mode
    </button>
  </div>

  <div class="math-panel">
    <div class="equation" id="equation"></div>
    <div class="solution" id="solution"
      style="display:none"></div>
  </div>

  <label class="answer-label" for="answer">
    Your answer
  </label>

  <input
    id="answer"
    type="text"
    placeholder="Enter an integer or fraction"
    autocomplete="off"
    spellcheck="false">

  <div class="actions">
    <button class="primary" type="button"
      onclick="checkAnswer()">
      Submit
    </button>

    <button class="secondary" type="button"
      onclick="newProblem()">
      Try Similar
    </button>
  </div>

  <button class="solution-btn" id="solutionBtn"
    type="button" onclick="toggleSolution()">
    Show Solution
  </button>

  <div class="feedback" id="feedback"
    aria-live="polite"></div>

</div>

<script>
let problem = null;
let showingSolution = false;
let previousEquation = "";

const $ = id => document.getElementById(id);

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function nonzero(min, max) {
  let n;
  do {
    n = rand(min, max);
  } while (n === 0);
  return n;
}

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);

  while (b !== 0) {
    const temp = b;
    b = a % b;
    a = temp;
  }

  return a;
}

function fraction(n, d = 1) {
  if (d < 0) {
    n = -n;
    d = -d;
  }

  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}

function texFraction(f) {
  if (f.d === 1) return String(f.n);

  const sign = f.n < 0 ? "-" : "";

  return sign + "\\frac{" +
    Math.abs(f.n) + "}{" + f.d + "}";
}

function math(s) {
  return "\\(" + s + "\\)";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(console.error);
  }
}

function makeProblem() {
  const type = rand(0, 3);

  let a, b, x, answer, equation, steps;

  if (type === 0) {
    // Multiplication: ax = b
    a = nonzero(-12, 12);
    x = fraction(nonzero(-15, 15), rand(1, 9));
    b = fraction(a * x.n, x.d);
    answer = x;

    const coefficient =
      a === 1 ? "" : a === -1 ? "-" : String(a);

    equation = coefficient + "x=" + texFraction(b);

    steps = [
      "Divide both sides by " + a + ".",
      math("x=\\left(" + texFraction(b) +
        "\\right)\\div\\left(" + a + "\\right)"),
      math("x=" + texFraction(answer))
    ];
  }

  if (type === 1) {
    // Division: x/a = b
    a = rand(2, 12);
    b = nonzero(-12, 12);
    answer = fraction(a * b);

    equation = "\\frac{x}{" + a + "}=" + b;

    steps = [
      "Multiply both sides by " + a + ".",
      math("x=" + a + "\\left(" + b + "\\right)"),
      math("x=" + texFraction(answer))
    ];
  }

  if (type === 2) {
    // Addition: x + a = b
    a = rand(1, 20);
    x = nonzero(-20, 20);
    b = x + a;
    answer = fraction(x);

    equation = "x+" + a + "=" + b;

    steps = [
      "Subtract " + a + " from both sides.",
      math("x=" + b + "-" + a),
      math("x=" + texFraction(answer))
    ];
  }

  if (type === 3) {
    // Subtraction: x - a = b
    a = rand(1, 20);
    x = nonzero(-20, 20);
    b = x - a;
    answer = fraction(x);

    equation = "x-" + a + "=" + b;

    steps = [
      "Add " + a + " to both sides.",
      math("x=" + b + "+" + a),
      math("x=" + texFraction(answer))
    ];
  }

  return { equation, answer, steps };
}

function newProblem() {
  let next;
  let attempts = 0;

  do {
    next = makeProblem();
    attempts++;
  } while (
    next.equation === previousEquation &&
    attempts < 30
  );

  problem = next;
  previousEquation = next.equation;
  showingSolution = false;

  $("equation").style.display = "block";
  $("solution").style.display = "none";
  $("equation").innerHTML = math(problem.equation);

  $("solutionBtn").textContent = "Show Solution";
  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  typeset();
}

function parseAnswer(value) {
  const s = value.trim().replace(/\s+/g, "");

  if (/^[+-]?\d+$/.test(s)) {
    const n = Number(s);
    if (!Number.isSafeInteger(n)) {
      return { valid: false };
    }
    return { ...fraction(n), valid: true };
  }

  const match = s.match(/^([+-]?\d+)\/([+-]?\d+)$/);

  if (!match) return { valid: false };

  const n = Number(match[1]);
  const d = Number(match[2]);

  if (!Number.isSafeInteger(n) ||
      !Number.isSafeInteger(d) || d === 0) {
    return { valid: false };
  }

  if (d < 0 || gcd(n, d) !== 1) {
    return { valid: false, simplify: true };
  }

  return { ...fraction(n, d), valid: true };
}

function checkAnswer() {
  const result = parseAnswer($("answer").value);
  const feedback = $("feedback");

  if (!result.valid) {
    feedback.textContent = result.simplify
      ? "Enter your answer in simplified form."
      : "Enter a valid integer or simplified fraction.";

    feedback.className = "feedback incorrect";
    return;
  }

  if (result.n === problem.answer.n &&
      result.d === problem.answer.d) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
  } else {
    feedback.textContent = "Not quite. Try again.";
    feedback.className = "feedback incorrect";
  }
}

function toggleSolution() {
  showingSolution = !showingSolution;

  if (showingSolution) {
    $("equation").style.display = "none";
    $("solution").style.display = "block";

    $("solution").innerHTML =
      '<div class="solution-title">Step-by-step solution</div>' +
      '<div class="solution-step">' +
      math(problem.equation) + '</div>' +
      problem.steps.map(step =>
        '<div class="solution-step">' +
        step + '</div>'
      ).join("");

    $("solutionBtn").textContent = "Hide Solution";
    typeset();
  } else {
    $("equation").style.display = "block";
    $("solution").style.display = "none";
    $("solutionBtn").textContent = "Show Solution";
  }
}

function toggleTheme() {
  const light = document.body.classList.toggle("light");

  $("themeBtn").textContent =
    light ? "Dark mode" : "Light mode";
}

$("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    checkAnswer();
  }
});

newProblem();
</script>
</body>
</html>
