
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponential Equations Using Logarithms</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
:root {
  font-family: Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 10px;
  background: #0e1727;
  color: #f5f7ff;
}
#app {
  max-width: 780px;
  margin: auto;
  padding: 16px;
  border-radius: 12px;
  background: #101a2b;
}
#app.light {
  background: #fff;
  color: #182235;
  color-scheme: light;
}
button, input { font: inherit; }
button {
  cursor: pointer;
  border: 1px solid #526a94;
  border-radius: 9px;
  padding: 11px;
  background: #30476e;
  color: white;
  font-weight: 600;
}
button:focus-visible,
input:focus-visible,
[contenteditable]:focus-visible {
  outline: 3px solid #b49bff;
  outline-offset: 2px;
}
.top {
  display: flex;
  justify-content: flex-end;
}
.problem {
  text-align: center;
  font-size: 1.2rem;
  background: #1a2b46;
  padding: 16px;
  border-radius: 10px;
  margin: 10px 0;
  overflow-x: auto;
}
.light .problem { background: #eaf0fa; }
label {
  display: block;
  font-weight: bold;
  margin: 14px 0 7px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}
.toolbar button { min-width: 43px; }
.editor {
  border: 1px solid #51658b;
  border-radius: 10px;
  background: #1a2b46;
  padding: 12px;
  min-height: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.light .editor { background: #f0f4fb; }
.fraction-part {
  width: 90%;
  min-height: 34px;
  padding: 6px;
  text-align: center;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.fraction-part:empty::before {
  content: attr(data-placeholder);
  opacity: .55;
}
.fraction-line {
  height: 1px;
  width: 75%;
  background: currentColor;
}
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #51658b;
  border-radius: 9px;
  background: #1a2b46;
  color: inherit;
}
.light input { background: #f0f4fb; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.actions button:first-child { background: #7453e8; }
.wide { grid-column: 1 / -1; }
.feedback {
  font-weight: bold;
  min-height: 20px;
  margin-top: 7px;
}
.correct { color: #65e6a0; }
.incorrect { color: #ff858d; }
.valid { border-color: #27b86e !important; }
.invalid { border-color: #e34e60 !important; }
.light .correct { color: #087c42; }
.light .incorrect { color: #ba2438; }
.solution {
  border: 1px solid #50678f;
  border-radius: 10px;
  background: #1a2b46;
  padding: 14px;
  margin-top: 14px;
  line-height: 1.55;
  overflow-x: auto;
}
.light .solution { background: #f0f4fb; }
.solution hr {
  border: 0;
  border-top: 1px solid #526582;
  margin: 12px 0;
}
.hint {
  font-size: .82rem;
  line-height: 1.4;
  opacity: .85;
}
#live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
@media(max-width:480px) {
  #app { padding: 12px; }
  .toolbar button { padding: 10px; min-width: 37px; }
}
</style>
</head>

<body>
<main id="app">

<div class="top">
  <button id="theme" aria-label="Switch to light mode">
    ☀ Light mode
  </button>
</div>

<div class="problem" id="problem"
     aria-label="Exponential equation"></div>

<label id="exactLabel">Exact Solution</label>

<div class="toolbar" aria-label="Math entry tools">
  <button data-insert="/" aria-label="Division">÷</button>
  <button data-insert="ln()">ln</button>
  <button data-insert="log()">log</button>
  <button data-insert="()">()</button>
  <button data-insert="+">+</button>
  <button data-insert="-">−</button>
  <button data-insert="*">×</button>
  <button id="back" aria-label="Backspace">⌫</button>
  <button id="clear">Clear</button>
</div>

<div class="editor" id="editor" role="group"
     aria-labelledby="exactLabel">
  <div id="num" class="fraction-part"
       contenteditable="true" role="textbox"
       aria-label="Exact solution numerator"
       data-placeholder="Numerator"
       spellcheck="false"></div>
  <div class="fraction-line"></div>
  <div id="den" class="fraction-part"
       contenteditable="true" role="textbox"
       aria-label="Exact solution denominator"
       data-placeholder="Denominator"
       spellcheck="false"></div>
</div>

<p class="hint">
Enter the exact solution using ln or log.
Click the numerator or denominator to edit.
Equivalent logarithmic expressions are accepted.
</p>

<div id="exactFeedback" class="feedback"
     aria-live="polite"></div>

<label for="decimal">
Decimal Approximation (4 decimal places)
</label>
<input id="decimal" inputmode="decimal"
       autocomplete="off"
       placeholder="Example: 0.3656">

<div id="decimalFeedback" class="feedback"
     aria-live="polite"></div>

<div class="actions">
  <button id="submit">Submit</button>
  <button id="next">Try Similar</button>
  <button id="toggle" class="wide"
          aria-expanded="false">Show Solution</button>
</div>

<section class="solution" id="solution" hidden></section>
<div id="live" aria-live="polite"></div>

</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const app = $("app");
const num = $("num");
const den = $("den");
const decimal = $("decimal");

let current;
let focusPart = num;
let problemIndex = -1;
let solutionVisible = false;

const bases = [2, 3, 5, 7, 11, 13];

function gcd(a, b) {
  return b ? gcd(b, a % b) : Math.abs(a);
}

function rand(min, max) {
  return min + Math.floor(
    Math.random() * (max - min + 1)
  );
}

function makeBank() {
  const bank = [];
  const seen = new Set();

  for (
    let attempts = 0;
    bank.length < 50 && attempts < 20000;
    attempts++
  ) {
    const a = bases[rand(0, bases.length - 1)];
    const b = bases[rand(0, bases.length - 1)];

    if (a === b) continue;

    const p = rand(-6, 6);
    const q = rand(-7, 7);
    const r = rand(-6, 6);
    const s = rand(-7, 7);

    if (!p || !q || !r || !s) continue;

    // Prevent a common numerical factor in
    // all coefficients of the exact answer.
    const common = gcd(
      gcd(Math.abs(p), Math.abs(q)),
      gcd(Math.abs(r), Math.abs(s))
    );

    if (common !== 1) continue;

    const denominator =
      p * Math.log(a) - r * Math.log(b);

    if (Math.abs(denominator) < 0.15) continue;

    const x = (
      s * Math.log(b) - q * Math.log(a)
    ) / denominator;

    if (
      !Number.isFinite(x) ||
      Math.abs(x) > 12 ||
      Math.abs(x) < 0.08
    ) continue;

    const key = [a,b,p,q,r,s].join(",");

    if (seen.has(key)) continue;

    seen.add(key);
    bank.push({a,b,p,q,r,s,x});
  }

  return bank;
}

const bank = makeBank();

function linear(p, q) {
  const first =
    p === 1 ? "x" :
    p === -1 ? "-x" : p + "x";

  return first +
    (q > 0 ? "+" + q : q < 0 ? q : "");
}

function signedLog(k, b) {
  return (k < 0 ? "-" : "+") +
    Math.abs(k) + "\\ln(" + b + ")";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(() => {});
  }
}

function renderProblem() {
  const v = current;

  $("problem").textContent =
    `\\[${v.a}^{${linear(v.p,v.q)}}=` +
    `${v.b}^{${linear(v.r,v.s)}}\\]`;

  const numerator =
    `${v.s}\\ln(${v.b})` +
    signedLog(-v.q, v.a);

  const denominator =
    `${v.p}\\ln(${v.a})` +
    signedLog(-v.r, v.b);

  $("solution").innerHTML = `
    <strong>Step-by-step solution</strong>

    <p><strong>Step 1:</strong>
    Take natural logarithms of both sides.</p>

    \\[
    \\ln(${v.a}^{${linear(v.p,v.q)}})
    =
    \\ln(${v.b}^{${linear(v.r,v.s)}})
    \\]

    <hr>

    <p><strong>Step 2:</strong>
    Apply the Power Property of Logarithms.</p>

    \\[
    (${linear(v.p,v.q)})\\ln(${v.a})
    =
    (${linear(v.r,v.s)})\\ln(${v.b})
    \\]

    <hr>

    <p><strong>Step 3:</strong>
    Collect terms containing x and isolate x.</p>

    \\[
    x=\\frac{${numerator}}{${denominator}}
    \\]

    <hr>

    <p><strong>Step 4:</strong>
    Round to four decimal places.</p>

    \\[
    x\\approx ${v.x.toFixed(4)}
    \\]
  `;

  typeset();
}

function nextProblem() {
  problemIndex = (problemIndex + 1) % bank.length;
  current = bank[problemIndex];

  num.textContent = "";
  den.textContent = "";
  decimal.value = "";

  ["editor", "decimal"].forEach(id => {
    $(id).classList.remove("valid", "invalid");
  });

  $("exactFeedback").textContent = "";
  $("decimalFeedback").textContent = "";

  solutionVisible = false;
  $("solution").hidden = true;
  $("toggle").textContent = "Show Solution";
  $("toggle").setAttribute("aria-expanded", "false");

  renderProblem();
}

// Mathematical expression parser.
// Supports arithmetic, parentheses, ln, log,
// division, multiplication, and powers.
// No eval() or dynamic JavaScript execution.

function parseMath(source) {
  let s = source.toLowerCase()
    .replace(/\u2212/g, "-")
    .replace(/\u00d7/g, "*")
    .replace(/\u00f7/g, "/")
    .replace(/\s+/g, "");

  let i = 0;
  let usedLog = false;

  function expression() {
    let value = term();

    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      const right = term();

      value = op === "+"
        ? value + right
        : value - right;
    }

    return value;
  }

  function term() {
    let value = power();

    while (s[i] === "*" || s[i] === "/") {
      const op = s[i++];
      const right = power();

      value = op === "*"
        ? value * right
        : value / right;
    }

    return value;
  }

  function power() {
    let value = unary();

    if (s[i] === "^") {
      i++;
      value = Math.pow(value, power());
    }

    return value;
  }

  function unary() {
    if (s[i] === "+") {
      i++;
      return unary();
    }

    if (s[i] === "-") {
      i++;
      return -unary();
    }

    return atom();
  }

  function atom() {
    if (s[i] === "(") {
      i++;
      const value = expression();

      if (s[i++] !== ")") {
        throw Error("Missing parenthesis");
      }

      return value;
    }

    const name = /^(ln|log)/.exec(s.slice(i));

    if (name) {
      i += name[0].length;

      if (s[i++] !== "(") {
        throw Error("Log requires parentheses");
      }

      const value = expression();

      if (s[i++] !== ")" || value <= 0) {
        throw Error("Invalid logarithm");
      }

      usedLog = true;

      return name[0] === "ln"
        ? Math.log(value)
        : Math.log10(value);
    }

    const match =
      /^(?:\d+(?:\.\d*)?|\.\d+)/.exec(s.slice(i));

    if (!match) {
      throw Error("Invalid expression");
    }

    i += match[0].length;
    return Number(match[0]);
  }

  const value = expression();

  if (i !== s.length || !Number.isFinite(value)) {
    throw Error("Invalid expression");
  }

  return {value, usedLog};
}

function setResult(id, feedbackId, correct, label) {
  $(id).classList.toggle("valid", correct);
  $(id).classList.toggle("invalid", !correct);

  const feedback = $(feedbackId);

  feedback.className =
    "feedback " + (correct ? "correct" : "incorrect");

  feedback.textContent =
    (correct ? "✓ Correct: " : "✕ Incorrect: ") +
    label;
}

function submitAnswers() {
  let exactCorrect = false;
  let decimalCorrect = false;

  try {
    const numerator = parseMath(num.textContent.trim());
    const denominator = parseMath(
      den.textContent.trim() || "1"
    );

    const value =
      numerator.value / denominator.value;

    exactCorrect =
      (numerator.usedLog || denominator.usedLog) &&
      denominator.value !== 0 &&
      Number.isFinite(value) &&
      Math.abs(value - current.x) <=
        1e-8 * Math.max(1, Math.abs(current.x));

  } catch (error) {
    exactCorrect = false;
  }

  const enteredDecimal = decimal.value.trim();

  if (
    /^[+-]?(?:\d+\.\d{4}|\.\d{4})$/.test(
      enteredDecimal
    )
  ) {
    decimalCorrect =
      Math.abs(
        Number(enteredDecimal) -
        Number(current.x.toFixed(4))
      ) < 1e-9;
  }

  setResult(
    "editor",
    "exactFeedback",
    exactCorrect,
    "Exact Solution"
  );

  setResult(
    "decimal",
    "decimalFeedback",
    decimalCorrect,
    "Decimal Approximation"
  );

  $("live").textContent =
    `Exact solution ${exactCorrect ? "correct" : "incorrect"}. ` +
    `Decimal approximation ${decimalCorrect ? "correct" : "incorrect"}.`;
}

// Insert math symbols at the cursor position.

function insertText(text) {
  const element = focusPart || num;
  element.focus();

  const selection = window.getSelection();

  if (
    !selection ||
    !selection.rangeCount ||
    !element.contains(selection.anchorNode)
  ) {
    element.append(document.createTextNode(text));
    return;
  }

  const range = selection.getRangeAt(0);
  range.deleteContents();

  const node = document.createTextNode(text);
  range.insertNode(node);

  const position =
    ["ln()", "log()", "()"].includes(text)
      ? text.length - 1
      : text.length;

  range.setStart(node, position);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);
}

[num, den].forEach(element => {
  element.addEventListener("focus", () => {
    focusPart = element;
  });

  element.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      (element === num ? den : decimal).focus();
    }
  });

  element.addEventListener("paste", event => {
    event.preventDefault();
    insertText(event.clipboardData.getData("text/plain"));
  });
});

document.querySelectorAll("[data-insert]").forEach(
  button => {
    button.addEventListener("click", () => {
      insertText(button.dataset.insert);
    });
  }
);

$("back").addEventListener("click", () => {
  focusPart.focus();
  document.execCommand("delete", false, null);
});

$("clear").addEventListener("click", () => {
  num.textContent = "";
  den.textContent = "";
  num.focus();
});

$("submit").addEventListener("click", submitAnswers);
$("next").addEventListener("click", nextProblem);

$("toggle").addEventListener("click", () => {
  solutionVisible = !solutionVisible;

  $("solution").hidden = !solutionVisible;
  $("toggle").textContent =
    solutionVisible ? "Hide Solution" : "Show Solution";

  $("toggle").setAttribute(
    "aria-expanded",
    String(solutionVisible)
  );

  if (solutionVisible) typeset();
});

$("theme").addEventListener("click", () => {
  const light = app.classList.toggle("light");

  document.documentElement.style.colorScheme =
    light ? "light" : "dark";

  $("theme").textContent =
    light ? "☾ Dark mode" : "☀ Light mode";

  $("theme").setAttribute(
    "aria-label",
    light ? "Switch to dark mode" : "Switch to light mode"
  );
});

nextProblem();

})();
</script>
</body>
</html>
