<style>

<body>
<main class="app">

<div class="top">
  <strong>Solve the exponential equation.</strong>

  <button id="theme" class="theme">

</div>

<div class="problem">
  <div class="prompt">

  </div>

<div class="answers">

  <div>
    <label class="answer-label">

    </label>

         role="toolbar"
         aria-label="Mathematical input tools">

      <button
        class="tool"
        type="button"
        id="fractionBtn"
        title="Insert stacked fraction">

        <span class="fraction-icon">
          <span>□</span>
          <span class="bar"></span>
          <span>□</span>

              data-symbol="ln">ln</button>

<script>
"use strict";

const $ = id => document.getElementById(id);

const rand = (a,b) =>
  Math.floor(Math.random()*(b-a+1))+a;

const tex = s => "\\(" + s + "\\)";

let problems = [];
let current = null;
let last = -1;
let shown = false;
let activeRegion = null;

// --------------------------------
// EQUATION GENERATION
// --------------------------------

function linearTex(a,b) {
  let s = a===1 ? "x" :
          a===-1 ? "-x" : a+"x";

  if(b>0) s += "+"+b;
  if(b<0) s += b;

  return s;
}

function generate() {
  const bases = [2,3,5,6,7,10,11,13];
  const seen = new Set();

  while(problems.length<50) {

    const leftBase =
      bases[rand(0,bases.length-1)];

    const rightBase =
      bases[rand(0,bases.length-1)];

    if(leftBase===rightBase) continue;

    const a = rand(-4,4);
    const c = rand(-4,4);

    if(a===0 || c===0) continue;

    const b = rand(-6,6);
    const d = rand(-6,6);

    const L = Math.log(leftBase);
    const R = Math.log(rightBase);

    const denominator = a*L-c*R;
    const numerator = d*R-b*L;

    if(Math.abs(denominator)<0.15) continue;

    const answer = numerator/denominator;

    if(!Number.isFinite(answer) ||
       Math.abs(answer)>30) continue;

    const key = [
      leftBase,a,b,rightBase,c,d
    ].join(",");

    if(seen.has(key)) continue;
    seen.add(key);

    problems.push({
      leftBase,rightBase,a,b,c,d,answer
    });
  }
}

// --------------------------------
// MATHJAX RENDERING
// --------------------------------

let mathQueue = Promise.resolve();

function typeset(el) {
  mathQueue = mathQueue.then(async () => {
    if(!window.MathJax) return;

    await MathJax.startup.promise;

    MathJax.typesetClear([el]);

    await MathJax.typesetPromise([el]);

    fitMath(el);
  }).catch(console.error);

  return mathQueue;
}

// Scale rendered mathematics to fit.
// No scrollbars are introduced.

function fitMath(parent) {
  const containers =
    parent.querySelectorAll("mjx-container");

  containers.forEach(container => {
    container.style.transform = "";
    container.style.width = "";
    container.style.transformOrigin = "center center";

    const available = parent.clientWidth - 12;
    const actual = container.scrollWidth;

    if(actual > available && available > 0) {
      const scale = available / actual;

      container.style.transform =
        `scale(${scale})`;

      container.style.width =
        `${100/scale}%`;
    }
  });
}

// --------------------------------
// CONTINUOUS MATH EDITOR
// --------------------------------

function makeRegion() {
  const region = document.createElement("span");

  region.className = "math-region";
  region.contentEditable = "true";
  region.spellcheck = false;

  region.setAttribute("role","textbox");

  region.setAttribute(
    "aria-label","Mathematical expression"
  );

  region.addEventListener("focus",() => {
    activeRegion = region;
  });

  region.addEventListener("input",() => {
    $("feedback").textContent = "";
  });

  return region;
}

function resetEditor() {
  const root = $("expressionRoot");
  root.replaceChildren();

  const region = makeRegion();
  root.append(region);

  activeRegion = region;
}

function setCaret(region,position) {
  region.focus();

  const selection = window.getSelection();
  const range = document.createRange();

  const textNode = region.firstChild;

  if(
    !textNode ||
    textNode.nodeType !== Node.TEXT_NODE
  ) {
    range.selectNodeContents(region);
    range.collapse(true);
  } else {
    const offset = Math.min(
      position,
      textNode.textContent.length
    );

    range.setStart(textNode,offset);
    range.collapse(true);
  }

  selection.removeAllRanges();
  selection.addRange(range);
}

function caretOffset(region) {
  const selection = window.getSelection();

  if(!selection.rangeCount) {
    return region.textContent.length;
  }

  const range = selection.getRangeAt(0).cloneRange();

  range.selectNodeContents(region);

  range.setEnd(
    selection.anchorNode,
    selection.anchorOffset
  );

  return range.toString().length;
}

function insertAtCaret(text,offsetBack=0) {
  if(!activeRegion) return;

  const region = activeRegion;
  const value = region.textContent;
  const pos = caretOffset(region);

  region.textContent =
    value.slice(0,pos) +
    text +
    value.slice(pos);

  setCaret(
    region,
    pos+text.length-offsetBack
  );

  $("feedback").textContent = "";
}

function insertLog(kind) {
  insertAtCaret(kind+"()",1);
}

function insertSymbol(symbol) {
  if(symbol==="ln" || symbol==="log") {
    insertLog(symbol);
    return;
  }

  if(symbol==="(") {
    insertAtCaret("()",1);
    return;
  }

  insertAtCaret(symbol);
}

// --------------------------------
// FRACTION EDITOR
// --------------------------------

function insertFraction() {
  const root = $("expressionRoot");

  const fraction = document.createElement("span");
  fraction.className = "fraction";

  const numerator = document.createElement("span");
  numerator.className = "numerator";

  const denominator = document.createElement("span");
  denominator.className = "denominator";

  const bar = document.createElement("span");
  bar.className = "fraction-bar";

  const top = makeRegion();
  const bottom = makeRegion();

  numerator.append(top);
  denominator.append(bottom);

  fraction.append(
    numerator,
    bar,
    denominator
  );

  if(
    activeRegion &&
    activeRegion.parentNode===root &&
    activeRegion.textContent.trim()===""
  ) {
    activeRegion.replaceWith(fraction);
  } else if(
    activeRegion &&
    activeRegion.parentNode
  ) {
    activeRegion.after(fraction);
  } else {
    root.append(fraction);
  }

  activeRegion = top;
  top.focus();
}

// --------------------------------
// DELETE
// --------------------------------

function deleteCharacter() {
  if(!activeRegion) return;

  const region = activeRegion;
  const value = region.textContent;
  const pos = caretOffset(region);

  if(pos===0) return;

  region.textContent =
    value.slice(0,pos-1) +
    value.slice(pos);

  setCaret(region,pos-1);
}

// --------------------------------
// READ EDITOR
// --------------------------------

function editorToExpression() {
  const root = $("expressionRoot");

  function readChildren(node) {
    return [...node.childNodes]
      .map(read)
      .join("");
  }

  function read(node) {
    if(node.nodeType===Node.TEXT_NODE) {
      return node.textContent;
    }

    if(node.classList?.contains("math-region")) {
      return node.textContent.trim();
    }

    if(node.classList?.contains("fraction")) {
      const numerator =
        node.querySelector(".numerator");

      const denominator =
        node.querySelector(".denominator");

      return "((" +
        readChildren(numerator) +
        ")/(" +
        readChildren(denominator) +
        "))";
    }

    return readChildren(node);
  }

  return readChildren(root);
}

// --------------------------------
// EXPRESSION EVALUATOR
// --------------------------------

function tokenize(input) {
  const s = input
    .replace(/\s+/g,"")
    .toLowerCase();

  const tokens = [];
  let i = 0;

  while(i<s.length) {
    const rest = s.slice(i);

    const number =
      rest.match(/^\d+(\.\d+)?/);

    if(number) {
      tokens.push({
        type:"number",
        value:Number(number[0])
      });

      i += number[0].length;
      continue;
    }

    if(rest.startsWith("ln")) {
      tokens.push({
        type:"fn",
        value:"ln"
      });

      i += 2;
      continue;
    }

    if(rest.startsWith("log")) {
      tokens.push({
        type:"fn",
        value:"log"
      });

      i += 3;
      continue;
    }

    const ch = s[i];

    if("+-*/()".includes(ch)) {
      tokens.push({
        type:ch,
        value:ch
      });

      i++;
      continue;
    }

    return null;
  }

  return tokens;
}

function evaluateExpression(input) {
  const tokens = tokenize(input);

  if(!tokens || !tokens.length) {
    return null;
  }

  let pos = 0;

  function peek() {
    return tokens[pos]?.type;
  }

  function eat(type) {
    if(peek()!==type) {
      throw Error("Syntax");
    }

    return tokens[pos++];
  }

  function primary() {
    if(peek()==="number") {
      return eat("number").value;
    }

    if(peek()==="fn") {
      const fn = eat("fn").value;

      eat("(");
      const value = expression();
      eat(")");

      if(value<=0) {
        throw Error("Log domain");
      }

      return fn==="ln" ?
        Math.log(value) :
        Math.log10(value);
    }

    if(peek()==="(") {
      eat("(");

      const value = expression();

      eat(")");

      return value;
    }

    throw Error("Syntax");
  }

  function unary() {
    if(peek()==="+") {
      eat("+");
      return unary();
    }

    if(peek()==="-") {
      eat("-");
      return -unary();
    }

    return primary();
  }

  function product() {
    let value = unary();

    while(
      peek()==="*" ||
      peek()==="/"
    ) {
      const op = eat(peek()).type;
      const right = unary();

      value = op==="*" ?
        value*right :
        value/right;
    }

    return value;
  }

  function expression() {
    let value = product();

    while(
      peek()==="+" ||
      peek()==="-"
    ) {
      const op = eat(peek()).type;
      const right = product();

      value = op==="+" ?
        value+right :
        value-right;
    }

    return value;
  }

  try {
    const result = expression();

    if(pos!==tokens.length) {
      return null;
    }

    return Number.isFinite(result) ?
      result :
      null;
  } catch(e) {
    return null;
  }
}

// --------------------------------
// NEW PROBLEM
// --------------------------------

function newProblem() {
  let i;

  do {
    i = rand(0,problems.length-1);
  } while(i===last);

  last = i;
  current = problems[i];
  shown = false;

  const p = current;

  $("equation").textContent = tex(
    `${p.leftBase}^{${linearTex(p.a,p.b)}}=
     ${p.rightBase}^{${linearTex(p.c,p.d)}}`
  );

  resetEditor();

  $("decimal").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  $("solution").style.display = "none";
  $("solution").replaceChildren();

  $("reveal").textContent = "Show Solution";

  typeset($("equation"));
}

// --------------------------------
// CHECK ANSWERS
// --------------------------------

function check() {
  const expression = editorToExpression();

  const exactValue =
    evaluateExpression(expression);

  const hasLog =
    /\b(?:ln|log)\s*\(/i.test(expression);

  const exactCorrect =
    hasLog &&
    exactValue!==null &&
    Math.abs(
      exactValue-current.answer
    )<1e-8;

  const decimalRaw =
    $("decimal").value.trim();

  const decimalCorrect =
    /^-?\d+\.\d{4}$/.test(decimalRaw) &&
    Number(decimalRaw) ===
      Number(current.answer.toFixed(4));

  const fb = $("feedback");

  if(exactCorrect && decimalCorrect) {
    fb.textContent =
      "Correct! Both answers are correct.";

    fb.className = "feedback good";
  } else {
    fb.textContent =
      `Exact: ${exactCorrect?"Correct":"Incorrect"} | `+
      `Decimal: ${decimalCorrect?"Correct":"Incorrect"}`;

    fb.className = "feedback bad";
  }
}

// --------------------------------
// WORKED SOLUTION FORMATTING
// --------------------------------

function signedLogTerm(
  coefficient,
  logExpression,
  first=false
) {
  if(coefficient===0) {
    return "";
  }

  const magnitude =
    Math.abs(coefficient);

  const coefficientText =
    magnitude===1 ? "" : magnitude;

  const term =
    coefficientText+logExpression;

  if(first) {
    return coefficient<0 ?
      "-"+term :
      term;
  }

  return coefficient<0 ?
    "-"+term :
    "+"+term;
}

function formatLogSum(terms) {
  let result = "";

  for(const term of terms) {
    if(term.coefficient===0) {
      continue;
    }

    result += signedLogTerm(
      term.coefficient,
      term.log,
      result===""
    );
  }

  return result || "0";
}

function addStep(container,label,math) {
  const step =
    document.createElement("div");

  step.className = "step";

  const heading =
    document.createElement("div");

  heading.className = "step-title";
  heading.textContent = label;

  const work =
    document.createElement("div");

  work.className = "work";
  work.textContent = tex(math);

  step.append(heading,work);
  container.append(step);
}

// --------------------------------
// WORKED SOLUTION
// --------------------------------

function showSolution() {
  shown = !shown;

  const el = $("solution");

  el.style.display =
    shown ? "block" : "none";

  $("reveal").textContent =
    shown ? "Hide Solution" :
            "Show Solution";

  if(!shown) return;

  el.replaceChildren();

  const p = current;

  const {
    leftBase,
    rightBase,
    a,b,c,d,answer
  } = p;

  const L = `\\ln(${leftBase})`;
  const R = `\\ln(${rightBase})`;

  const leftExp = linearTex(a,b);
  const rightExp = linearTex(c,d);

  const heading =
    document.createElement("strong");

  heading.textContent =
    "Step-by-step solution";

  el.append(heading);

  addStep(
    el,
    "Step 1: Take natural logarithms of both sides.",
    `\\ln(${leftBase}^{${leftExp}})=
     \\ln(${rightBase}^{${rightExp}})`
  );

  addStep(
    el,
    "Step 2: Apply the logarithm power property.",
    `(${leftExp})${L}=
     (${rightExp})${R}`
  );

  const numerator = formatLogSum([
    {coefficient:d,log:R},
    {coefficient:-b,log:L}
  ]);

  const denominator = formatLogSum([
    {coefficient:a,log:L},
    {coefficient:-c,log:R}
  ]);

  addStep(
    el,
    "Step 3: Isolate x.",
    `x=\\frac{${numerator}}{${denominator}}`
  );

  addStep(
    el,
    "Step 4: Round to four decimal places.",
    `x\\approx ${answer.toFixed(4)}`
  );

  typeset(el);
}

      check();
    }
  }
);

generate();
newProblem();
