
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponential Equations Using Logarithms</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  },
  options: { enableMenu: false }
};
</script>
<script defer
 src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
</script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font: 16px/1.5 Arial, sans-serif;
  background: transparent;
}

#practice {
  --bg: #101827;
  --panel: #1c2b43;
  --field: #142139;
  --text: #f7f9ff;
  --muted: #c8d4e8;
  --border: #7285a6;
  --button: #334e79;
  --accent: #7657e9;
  --good: #7af0b1;
  --bad: #ff9fa6;

  background: var(--bg);
  color: var(--text);
  max-width: 780px;
  margin: auto;
  padding: 16px;
  border-radius: 12px;
}

#practice.light {
  --bg: #ffffff;
  --panel: #edf2fa;
  --field: #ffffff;
  --text: #17243a;
  --muted: #394b65;
  --border: #6d7d96;
  --button: #304c76;
  --accent: #5a36c8;
  --good: #08683c;
  --bad: #a51f30;
}

button, input { font: inherit; }

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 13px;
  min-height: 44px;
  color: #ffffff;
  background: var(--button);
  font-weight: 650;
  cursor: pointer;
}

button:hover { filter: brightness(1.12); }

button:focus-visible,
input:focus-visible {
  outline: 3px solid #e9a845;
  outline-offset: 3px;
}

.top {
  display: flex;
  justify-content: flex-end;
}

.equation {
  background: var(--panel);
  border-radius: 10px;
  padding: 14px 10px;
  margin: 10px 0 14px;
  text-align: center;
  font-size: 1.2rem;
  overflow-x: auto;
}

.section { margin-top: 12px; }

.section label {
  display: block;
  font-weight: 700;
  margin-bottom: 6px;
}

.hint {
  font-size: .83rem;
  color: var(--muted);
  margin: 6px 0 8px;
}

.mathbar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}

.mathbar button {
  min-width: 44px;
  padding: 7px 11px;
}

.mathbar button:last-child {
  margin-left: auto;
}

.fraction {
  display: grid;
  grid-template-rows: auto 2px auto;
  gap: 4px;
  max-width: 460px;
  margin: auto;
  padding: 8px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.fraction input {
  text-align: center;
  min-height: 42px;
  padding: 8px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  width: 100%;
}

.bar {
  height: 2px;
  background: var(--text);
  margin: 0 12px;
}

.preview {
  margin-top: 7px;
  text-align: center;
  min-height: 35px;
  overflow-x: auto;
}

.preview-label {
  font-size: .8rem;
  color: var(--muted);
}

.decimal {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--field);
  color: var(--text);
}

.feedback {
  min-height: 23px;
  margin: 6px 0;
  font-weight: 700;
  font-size: .9rem;
}

.good { color: var(--good); }
.bad { color: var(--bad); }

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.actions #submit { background: var(--accent); }
.actions #toggle { grid-column: 1 / -1; }

.solution {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-top: 12px;
  overflow-x: auto;
}

.solution p { margin: 8px 0; }

.solution hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 12px 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

.field-error {
  border: 2px solid var(--bad) !important;
}

.field-good {
  border: 2px solid var(--good) !important;
}

@media(max-width:420px) {
  #practice { padding: 12px; }
  .mathbar button {
    min-width: 40px;
    padding: 7px 9px;
  }
  .actions { gap: 6px; }
}
</style>
</head>

<body>
<main id="practice">

<div class="top">
  <button id="theme" type="button"
    aria-label="Switch to light mode">
    ☀ Light mode
  </button>
</div>

<div id="equation" class="equation"
  aria-label="Solve the exponential equation"></div>

<section class="section" aria-labelledby="exact-heading">
  <label id="exact-heading" for="numerator">
    Exact Solution
  </label>

  <div class="mathbar" role="group"
    aria-label="Insert mathematical symbols">
    <button type="button" data-symbol="ln()">ln</button>
    <button type="button" data-symbol="log()">log</button>
    <button type="button" data-symbol="()">( )</button>
    <button type="button" data-symbol="+">+</button>
    <button type="button" data-symbol="-">−</button>
    <button type="button" data-symbol="*">×</button>
    <button type="button" id="backspace"
      aria-label="Delete previous character">⌫</button>
    <button type="button" id="clear">Clear</button>
  </div>

  <div class="fraction" id="fraction">
    <input id="numerator" type="text"
      spellcheck="false" autocomplete="off"
      aria-label="Numerator of exact solution"
      aria-describedby="entry-hint"
      placeholder="Numerator">

    <div class="bar" aria-hidden="true"></div>

    <input id="denominator" type="text"
      spellcheck="false" autocomplete="off"
      aria-label="Denominator of exact solution"
      aria-describedby="entry-hint"
      placeholder="Denominator">
  </div>

  <p class="hint" id="entry-hint">
    Enter logarithmic expressions using ln or log.
    Use the keyboard or mathematical buttons to
    construct your exact solution.
  </p>

  <div class="preview-label">Formatted Preview</div>
  <div class="preview" id="preview"
    aria-hidden="true"></div>

  <div class="feedback" id="exact-feedback"
    role="status" aria-live="polite"></div>
</section>

<section class="section">
  <label for="decimal">
    Decimal Approximation (4 decimal places)
  </label>

  <input class="decimal" id="decimal" type="text"
    inputmode="decimal" autocomplete="off"
    placeholder="e.g. 0.3656"
    aria-describedby="decimal-hint">

  <p class="hint" id="decimal-hint">
    Include exactly four digits after the decimal point.
  </p>

  <div class="feedback" id="decimal-feedback"
    role="status" aria-live="polite"></div>
</section>

<div class="actions">
  <button id="submit" type="button">Submit</button>
  <button id="next" type="button">Try Similar</button>
  <button id="toggle" type="button"
    aria-expanded="false" aria-controls="solution">
    Show Solution
  </button>
</div>

<section id="solution" class="solution" hidden
  aria-label="Step-by-step solution"></section>

<div id="announce" class="sr-only"
  aria-live="polite"></div>

</main>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const root = $('practice');
const n = $('numerator');
const d = $('denominator');
const dec = $('decimal');

let active = n;
let current = null;
let shown = false;
let lastKey = '';

const bases = [2,3,5,7,11,13];

const rnd = (a,b) =>
  Math.floor(Math.random() * (b-a+1)) + a;

const gcd = (a,b) =>
  b ? gcd(b,a%b) : Math.abs(a);

const fmt = a =>
  a === 1 ? 'x' : a === -1 ? '-x' : a+'x';

const lin = (a,b) =>
  fmt(a)+(b>0?'+'+b:b<0?b:'');

const ln = (k,b) => k+'\\ln('+b+')';

function typeset(els) {
  if(window.MathJax?.typesetPromise) {
    MathJax.typesetClear?.(els);
    MathJax.typesetPromise(els).catch(()=>{});
  }
}

function generate() {
  for(let t=0;t<3000;t++) {
    let a=bases[rnd(0,5)];
    let b=bases[rnd(0,5)];
    let p=rnd(-6,6);
    let q=rnd(-8,8);
    let r=rnd(-6,6);
    let s=rnd(-8,8);

    if(a===b || !p || !q || !r || !s) continue;

    if(gcd(gcd(gcd(
      Math.abs(p),Math.abs(q)),
      Math.abs(r)),Math.abs(s))!==1) continue;

    let D=p*Math.log(a)-r*Math.log(b);
    let N=s*Math.log(b)-q*Math.log(a);
    let x=N/D;

    if(Math.abs(D)<.2 ||
       !Number.isFinite(x) ||
       Math.abs(x)>12 ||
       Math.abs(x)<.08) continue;

    let key=[a,b,p,q,r,s].join(',');

    if(key===lastKey) continue;

    lastKey=key;
    return {a,b,p,q,r,s,x};
  }

  throw Error('Unable to generate problem');
}

function parse(src) {
  let s=src.toLowerCase()
    .replace(/[−–]/g,'-')
    .replace(/×/g,'*')
    .replace(/÷/g,'/')
    .replace(/\s/g,'');

  let i=0, used=false;

  function expression() {
    let v=term();
    while(s[i]==='+' || s[i]==='-') {
      let op=s[i++];
      let w=term();
      v=op==='+'?v+w:v-w;
    }
    return v;
  }

  function term() {
    let v=unary();
    while(s[i]==='*' || s[i]==='/') {
      let op=s[i++];
      let w=unary();
      v=op==='*'?v*w:v/w;
    }
    return v;
  }

  function unary() {
    if(s[i]==='+') { i++; return unary(); }
    if(s[i]==='-') { i++; return -unary(); }
    return atom();
  }

  function atom() {
    if(s[i]==='(') {
      i++;
      let v=expression();
      if(s[i++]!==')') throw Error('Parentheses');
      return v;
    }

    let m=/^(ln|log)/.exec(s.slice(i));

    if(m) {
      i+=m[0].length;

      if(s[i++]!=='(')
        throw Error('Log parentheses');

      let v=expression();

      if(s[i++]!==')' || v<=0)
        throw Error('Log domain');

      used=true;

      return m[0]==='ln'
        ? Math.log(v)
        : Math.log10(v);
    }

    let z=/^(?:\d+(?:\.\d*)?|\.\d+)/
      .exec(s.slice(i));

    if(!z) throw Error('Invalid character');

    i+=z[0].length;
    return Number(z[0]);
  }

  let value=expression();

  if(i!==s.length || !Number.isFinite(value))
    throw Error('Invalid expression');

  return {value,used};
}

function mathTex(src) {
  let s=src.trim();

  if(!s) return '\\square';

  if(!/^[\d\s()+\-*/.a-zA-Z]+$/.test(s))
    return '\\text{Enter a valid expression}';

  return s
    .replace(/\blog\(/gi,'\\log(')
    .replace(/\bln\(/gi,'\\ln(')
    .replace(/\*/g,'\\cdot ');
}

let previewTask=0;

function updatePreview() {
  let k=++previewTask;

  Promise.resolve().then(()=>{
    if(k!==previewTask) return;

    $('preview').textContent=
      '\\[\\frac{'+mathTex(n.value)+'}{'+
      mathTex(d.value||'1')+'}\\]';

    typeset([$('preview')]);
  });
}

function clearFeedback() {
  for(const id of [
    'exact-feedback','decimal-feedback'
  ]) {
    $(id).textContent='';
    $(id).className='feedback';
  }

  for(const el of [n,d,dec])
    el.classList.remove(
      'field-good','field-error'
    );
}

function newProblem() {
  current=generate();

  n.value='';
  d.value='';
  dec.value='';

  clearFeedback();

  $('equation').textContent=
    '\\['+current.a+'^{'+
    lin(current.p,current.q)+'}='+
    current.b+'^{'+
    lin(current.r,current.s)+'}\\]';

  let v=current;

  let N=ln(v.s,v.b)+
    (v.q<0?'+':'-')+
    ln(Math.abs(v.q),v.a);

  let D=ln(v.p,v.a)+
    (v.r<0?'+':'-')+
    ln(Math.abs(v.r),v.b);

  $('solution').innerHTML=`
    <strong>Step-by-step solution</strong>

    <p><strong>Step 1:</strong>
    Take natural logarithms of both sides.</p>

    \\[
    \\ln(${v.a}^{${lin(v.p,v.q)}})
    =
    \\ln(${v.b}^{${lin(v.r,v.s)}})
    \\]

    <hr>

    <p><strong>Step 2:</strong>
    Apply the power property.</p>

    \\[
    (${lin(v.p,v.q)})\\ln(${v.a})
    =
    (${lin(v.r,v.s)})\\ln(${v.b})
    \\]

    <hr>

    <p><strong>Step 3:</strong>
    Collect the terms with x and solve.</p>

    \\[
    x=\\frac{${N}}{${D}}
    \\]

    <hr>

    <p><strong>Step 4:</strong>
    Round to four decimal places.</p>

    \\[
    x\\approx ${v.x.toFixed(4)}
    \\]
  `;

  shown=false;
  $('solution').hidden=true;
  $('toggle').textContent='Show Solution';
  $('toggle').setAttribute(
    'aria-expanded','false'
  );

  updatePreview();
  typeset([$('equation'),$('solution')]);

  $('announce').textContent=
    'New exponential equation loaded.';
}

function feedback(id,ok,text) {
  let el=$(id);

  el.textContent=
    (ok?'✓ Correct: ':'✕ Incorrect: ')+text;

  el.className=
    'feedback '+(ok?'good':'bad');
}

function submit() {
  let exact=false;

  try {
    let A=parse(n.value);
    let B=parse(d.value.trim()||'1');
    let x=A.value/B.value;

    exact=(A.used||B.used) &&
      Math.abs(B.value)>1e-12 &&
      Number.isFinite(x) &&
      Math.abs(x-current.x)<=
      1e-8*Math.max(1,Math.abs(current.x));

  } catch(e) {}

  let rounded=current.x.toFixed(4);

  let decimal=
    /^[+-]?(?:\d+\.\d{4}|\.\d{4})$/
      .test(dec.value.trim()) &&
    Math.abs(
      Number(dec.value)-Number(rounded)
    )<1e-9;

  feedback(
    'exact-feedback',exact,'Exact solution'
  );

  feedback(
    'decimal-feedback',
    decimal,'Decimal approximation'
  );

  n.classList.toggle('field-good',exact);
  n.classList.toggle('field-error',!exact);

  d.classList.toggle('field-good',exact);
  d.classList.toggle('field-error',!exact);

  dec.classList.toggle('field-good',decimal);
  dec.classList.toggle('field-error',!decimal);

  $('announce').textContent=
    'Exact answer '+
    (exact?'correct':'incorrect')+
    '. Decimal answer '+
    (decimal?'correct':'incorrect')+'.';
}

function insert(text) {
  let el=active;

  let start=el.selectionStart??el.value.length;
  let end=el.selectionEnd??start;

  el.value=
    el.value.slice(0,start)+text+
    el.value.slice(end);

  let pos=start+text.length-
    ((text==='ln()' ||
      text==='log()' ||
      text==='()')?1:0);

  el.focus();
  el.setSelectionRange(pos,pos);
  updatePreview();
}

[n,d].forEach(el=>{
  el.addEventListener('focus',()=>{
    active=el;
  });

  el.addEventListener('input',updatePreview);

  el.addEventListener('keydown',e=>{
    if(e.key==='Enter') {
      e.preventDefault();
      (el===n?d:dec).focus();
    }
  });
});

document.querySelectorAll('[data-symbol]')
  .forEach(b=>b.addEventListener(
    'click',()=>insert(b.dataset.symbol)
  ));

$('backspace').addEventListener('click',()=>{
  let el=active;
  let start=el.selectionStart;
  let end=el.selectionEnd;

  if(start===end && start>0) start--;

  el.value=
    el.value.slice(0,start)+
    el.value.slice(end);

  el.focus();
  el.setSelectionRange(start,start);
  updatePreview();
});

$('clear').addEventListener('click',()=>{
  n.value='';
  d.value='';
  updatePreview();
  n.focus();
});

$('submit').addEventListener('click',submit);
$('next').addEventListener('click',newProblem);

$('toggle').addEventListener('click',()=>{
  shown=!shown;

  $('solution').hidden=!shown;

  $('toggle').textContent=
    shown?'Hide Solution':'Show Solution';

  $('toggle').setAttribute(
    'aria-expanded',String(shown)
  );

  if(shown) typeset([$('solution')]);
});

$('theme').addEventListener('click',()=>{
  let light=root.classList.toggle('light');

  $('theme').textContent=
    light?'☾ Dark mode':'☀ Light mode';

  $('theme').setAttribute(
    'aria-label',
    light?'Switch to dark mode':
          'Switch to light mode'
  );
});

newProblem();

})();
</script>
</body>
</html>
