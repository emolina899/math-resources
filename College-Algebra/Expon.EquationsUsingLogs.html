
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exponential Equations Practice</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  options: { enableMenu: false }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font: 16px/1.45 system-ui, Arial, sans-serif;
}

#app {
  --bg: #111827;
  --panel: #1f2937;
  --field: #111827;
  --text: #f9fafb;
  --muted: #d1d5db;
  --border: #9ca3af;
  --primary: #6246db;
  --good: #86efac;
  --bad: #fda4af;
  background: var(--bg);
  color: var(--text);
  max-width: 760px;
  margin: auto;
  padding: 16px;
  border-radius: 12px;
}

#app.light {
  --bg: #fff;
  --panel: #edf2f9;
  --field: #fff;
  --text: #172033;
  --muted: #45536b;
  --border: #64748b;
  --primary: #5134bd;
  --good: #08683c;
  --bad: #a11b30;
}

button, input { font: inherit; }

button {
  min-height: 44px;
  padding: 8px 12px;
  border: 0;
  border-radius: 8px;
  background: #36537c;
  color: white;
  font-weight: 650;
  cursor: pointer;
}

button:hover { filter: brightness(1.1); }

button:focus-visible,
input:focus-visible {
  outline: 3px solid #e9a845;
  outline-offset: 2px;
}

.top {
  display: flex;
  justify-content: flex-end;
}

.problem {
  margin: 10px 0 14px;
  padding: 14px 8px;
  text-align: center;
  background: var(--panel);
  border-radius: 10px;
  font-size: 1.18rem;
  overflow-x: auto;
}

.label {
  display: block;
  font-weight: 700;
  margin: 12px 0 6px;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}

.tools button { min-width: 44px; }

.tools .fraction-button {
  background: var(--primary);
}

.answer-box {
  background: var(--panel);
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.entry {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
}

.fraction-entry {
  width: min(100%, 460px);
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
}

.fraction-line {
  height: 2px;
  background: var(--text);
  margin: 0 8px;
}

.fraction-entry input { text-align: center; }

.fraction-help {
  font-size: .82rem;
  color: var(--muted);
  margin: 6px 0 0;
}

.feedback {
  min-height: 22px;
  margin: 6px 0;
  font-weight: 650;
  font-size: .9rem;
}

.good { color: var(--good); }
.bad { color: var(--bad); }

.good-field {
  border: 2px solid var(--good) !important;
}

.bad-field {
  border: 2px solid var(--bad) !important;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.actions #submit { background: var(--primary); }
.actions #show { grid-column: 1/-1; }

.solution {
  margin-top: 12px;
  background: var(--panel);
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow-x: auto;
}

.solution p { margin: 7px 0; }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

[hidden] { display: none !important; }

@media(max-width:450px) {
  #app { padding: 12px; }
  .tools button { padding: 8px 9px; }
}
</style>
</head>

<body>
<main id="app">

<div class="top">
  <button id="theme" type="button">Light mode</button>
</div>

<div class="problem" id="problem"
  aria-label="Exponential equation to solve"></div>

<label class="label" id="exact-label" for="plain">
  Exact Solution
</label>

<div class="tools" role="group" aria-label="Math entry tools">
  <button type="button" id="fraction-toggle"
    class="fraction-button" aria-pressed="false">a/b</button>
  <button type="button" data-insert="ln()">ln</button>
  <button type="button" data-insert="log()">log</button>
  <button type="button" data-insert="()">( )</button>
  <button type="button" data-insert="+">+</button>
  <button type="button" data-insert="-">−</button>
  <button type="button" data-insert="*">×</button>
  <button type="button" id="backspace"
    aria-label="Backspace">⌫</button>
  <button type="button" id="clear">Clear</button>
</div>

<div class="answer-box">
  <div id="plain-wrap">
    <input class="entry" id="plain" type="text"
      autocomplete="off" spellcheck="false"
      aria-label="Exact solution"
      placeholder="Enter exact solution">
  </div>

  <div id="fraction-wrap" hidden>
    <div class="fraction-entry" role="group"
      aria-label="Exact solution as a fraction">
      <input class="entry" id="num" type="text"
        autocomplete="off" spellcheck="false"
        aria-label="Fraction numerator"
        placeholder="Numerator">
      <div class="fraction-line" aria-hidden="true"></div>
      <input class="entry" id="den" type="text"
        autocomplete="off" spellcheck="false"
        aria-label="Fraction denominator"
        placeholder="Denominator">
    </div>
  </div>
</div>

<p class="fraction-help" id="help">
  Select a/b to enter an answer with a straight
  horizontal fraction bar. Use ln or log when needed.
</p>

<div id="exact-feedback" class="feedback"
  role="status" aria-live="polite"></div>

<label class="label" for="decimal">
  Decimal Approximation (4 decimal places)
</label>
<input class="entry" id="decimal" type="text"
  inputmode="decimal" autocomplete="off"
  placeholder="0.1234">

<div id="decimal-feedback" class="feedback"
  role="status" aria-live="polite"></div>

<div class="actions">
  <button id="submit" type="button">Submit</button>
  <button id="next" type="button">Try Similar</button>
  <button id="show" type="button"
    aria-expanded="false" aria-controls="solution">
    Show Solution
  </button>
</div>

<section id="solution" class="solution"
  aria-label="Step-by-step solution" hidden></section>

<div id="announce" class="sr" aria-live="polite"></div>

</main>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const app = $('app');
const plain = $('plain');
const num = $('num');
const den = $('den');
const decimal = $('decimal');

const bases = [2,3,5,7,11,13];
const rand = (a,b) =>
  Math.floor(Math.random()*(b-a+1))+a;

let mode = 'plain';
let active = plain;
let problem = null;
let previous = '';
let showing = false;

function lin(a,b) {
  return (a===1?'x':a===-1?'-x':a+'x')+
    (b>0?'+'+b:b<0?b:'');
}

function gcd(a,b) {
  return b ? gcd(b,a%b) : Math.abs(a);
}

function texSigned(k,b) {
  return (k<0?'-':'')+
    (Math.abs(k)===1?'':Math.abs(k))+
    '\\ln('+b+')';
}

function texSum(k1,b1,k2,b2) {
  return texSigned(k1,b1)+
    (k2<0?'-':'+')+
    (Math.abs(k2)===1?'':Math.abs(k2))+
    '\\ln('+b2+')';
}

function typeset(elements) {
  if(window.MathJax?.typesetPromise) {
    window.MathJax.typesetClear?.(elements);
    window.MathJax.typesetPromise(elements)
      .catch(()=>{});
  }
}

function makeProblem() {
  for(let t=0;t<10000;t++) {
    const common = Math.random()<.38;
    let a = bases[rand(0,bases.length-1)];
    let b = common ? a :
      bases[rand(0,bases.length-1)];

    if(!common && a===b) continue;

    let p=rand(-7,7), q=rand(-9,9);
    let r=rand(-7,7), s=rand(-9,9);

    if(!p || !r || p===r || !q || !s)
      continue;

    if(gcd(gcd(gcd(
      Math.abs(p),Math.abs(q)),
      Math.abs(r)),Math.abs(s))!==1)
      continue;

    let D=p*Math.log(a)-r*Math.log(b);
    let N=s*Math.log(b)-q*Math.log(a);
    let x=N/D;

    if(Math.abs(D)<.18 ||
       !Number.isFinite(x) ||
       Math.abs(x)>12 ||
       Math.abs(x)<.05) continue;

    const key=[a,b,p,q,r,s].join(',');
    if(key===previous) continue;

    previous=key;
    return {a,b,p,q,r,s,x,common};
  }

  throw Error('Problem generation failed');
}

function parse(input) {
  const s=input.toLowerCase()
    .replace(/[−–]/g,'-')
    .replace(/×/g,'*')
    .replace(/÷/g,'/')
    .replace(/\s/g,'');

  let i=0, logs=false;

  function expression() {
    let v=term();
    while(s[i]==='+' || s[i]==='-') {
      const op=s[i++];
      const w=term();
      v=op==='+'?v+w:v-w;
    }
    return v;
  }

  function term() {
    let v=unary();
    while(s[i]==='*' || s[i]==='/') {
      const op=s[i++];
      const w=unary();
      v=op==='*'?v*w:v/w;
    }
    return v;
  }

  function unary() {
    if(s[i]==='+') {
      i++;
      return unary();
    }
    if(s[i]==='-') {
      i++;
      return -unary();
    }
    return atom();
  }

  function atom() {
    if(s[i]==='(') {
      i++;
      const v=expression();
      if(s[i++]!==')')
        throw Error('Unclosed parenthesis');
      return v;
    }

    const m=/^(ln|log)/.exec(s.slice(i));

    if(m) {
      i+=m[0].length;

      if(s[i++]!=='(')
        throw Error('Expected opening parenthesis');

      const v=expression();

      if(s[i++]!==')' || v<=0)
        throw Error('Invalid logarithm');

      logs=true;

      return m[0]==='ln'
        ? Math.log(v)
        : Math.log10(v);
    }

    const z=/^(?:\d+(?:\.\d*)?|\.\d+)/
      .exec(s.slice(i));

    if(!z) throw Error('Invalid expression');

    i+=z[0].length;
    return Number(z[0]);
  }

  const value=expression();

  if(i!==s.length || !Number.isFinite(value))
    throw Error('Invalid expression');

  return {value,logs};
}

function setMode(next) {
  if(mode===next) return;

  mode=next;
  $('plain-wrap').hidden=next!=='plain';
  $('fraction-wrap').hidden=next!=='fraction';

  $('fraction-toggle').setAttribute(
    'aria-pressed',String(next==='fraction')
  );
  $('fraction-toggle').textContent=
    next==='fraction'?'a/b ✓':'a/b';

  if(next==='fraction' && plain.value.trim()) {
    num.value=plain.value;
    plain.value='';
  } else if(next==='plain' &&
    (num.value || den.value)) {
    plain.value='('+num.value+')/('+
      den.value+')';
    num.value='';
    den.value='';
  }

  active=next==='plain'?plain:num;
  active.focus();
  clearFeedback();
}

function clearFeedback() {
  for(const id of [
    'exact-feedback','decimal-feedback'
  ]) {
    $(id).textContent='';
    $(id).className='feedback';
  }

  for(const el of [plain,num,den,decimal])
    el.classList.remove(
      'good-field','bad-field'
    );
}

function reset() {
  problem=makeProblem();

  setMode('plain');
  plain.value='';
  num.value='';
  den.value='';
  decimal.value='';
  clearFeedback();

  const v=problem;

  $('problem').textContent=
    '\\['+v.a+'^{'+lin(v.p,v.q)+'}='+
    v.b+'^{'+lin(v.r,v.s)+'}\\]';

  let html='';

  if(v.common) {
    html=
      '<p><strong>Step 1:</strong> '+
      'Since the bases match, equate exponents.</p>'+
      '\\['+lin(v.p,v.q)+'='+
      lin(v.r,v.s)+'\\]'+
      '<p><strong>Step 2:</strong> '+
      'Collect terms and solve.</p>'+
      '\\[('+v.p+'-'+v.r+')x='+
      v.s+'-('+v.q+')\\]';
  } else {
    html=
      '<p><strong>Step 1:</strong> '+
      'Take natural logarithms.</p>'+
      '\\[('+lin(v.p,v.q)+')\\ln('+
      v.a+')=('+lin(v.r,v.s)+
      ')\\ln('+v.b+')\\]'+
      '<p><strong>Step 2:</strong> '+
      'Collect terms and solve.</p>'+
      '\\[x=\\frac{'+
      texSum(v.s,v.b,-v.q,v.a)+
      '}{'+
      texSum(v.p,v.a,-v.r,v.b)+
      '}\\]';
  }

  $('solution').innerHTML=
    html+
    '<p><strong>Decimal approximation:'+
    '</strong></p>\\[x\\approx '+
    v.x.toFixed(4)+'\\]';

  showing=false;
  $('solution').hidden=true;
  $('show').textContent='Show Solution';
  $('show').setAttribute(
    'aria-expanded','false'
  );

  typeset([$('problem')]);

  $('announce').textContent=
    'New exponential equation loaded.';
}

function feedback(id,ok,label) {
  $(id).textContent=
    (ok?'✓ Correct: ':'✕ Incorrect: ')+label;

  $(id).className=
    'feedback '+(ok?'good':'bad');
}

function submit() {
  let exact=false;

  try {
    let answer;

    if(mode==='fraction') {
      if(!num.value.trim() ||
         !den.value.trim())
        throw Error('Incomplete fraction');

      const n=parse(num.value);
      const d=parse(den.value);

      if(Math.abs(d.value)<1e-12)
        throw Error('Zero denominator');

      answer=n.value/d.value;
    } else {
      if(!plain.value.trim())
        throw Error('Blank');

      answer=parse(plain.value).value;
    }

    exact=Number.isFinite(answer) &&
      Math.abs(answer-problem.x)<=
      1e-9*Math.max(1,Math.abs(problem.x));

  } catch(e) {}

  const s=decimal.value.trim();
  const rounded=problem.x.toFixed(4);

  const decOK=
    /^[+-]?(?:\d+\.\d{4}|\.\d{4})$/
      .test(s) &&
    Math.abs(
      Number(s)-Number(rounded)
    )<1e-9;

  feedback(
    'exact-feedback',exact,'Exact solution'
  );
  feedback(
    'decimal-feedback',decOK,
    'Decimal approximation'
  );

  for(const el of mode==='fraction'
    ?[num,den]:[plain]) {
    el.classList.add(
      exact?'good-field':'bad-field'
    );
  }

  decimal.classList.add(
    decOK?'good-field':'bad-field'
  );

  $('announce').textContent=
    'Exact solution '+
    (exact?'correct':'incorrect')+
    '. Decimal approximation '+
    (decOK?'correct':'incorrect')+'.';
}

function insert(text) {
  const el=active;
  const start=el.selectionStart??el.value.length;
  const end=el.selectionEnd??start;

  el.value=
    el.value.slice(0,start)+
    text+
    el.value.slice(end);

  const pos=start+text.length-
    (['ln()','log()','()'].includes(text)
      ?1:0);

  el.focus();
  el.setSelectionRange(pos,pos);
  clearFeedback();
}

[plain,num,den].forEach(el=>{
  el.addEventListener('focus',()=>{
    active=el;
  });

  el.addEventListener('input',clearFeedback);

  el.addEventListener('keydown',e=>{
    if(e.key==='Enter') {
      e.preventDefault();

      if(el===num) den.focus();
      else if(el===plain || el===den)
        decimal.focus();
    }
  });
});

decimal.addEventListener(
  'input',clearFeedback
);

$('fraction-toggle').addEventListener(
  'click',()=>{
    setMode(
      mode==='plain'?'fraction':'plain'
    );
  }
);

document.querySelectorAll('[data-insert]')
  .forEach(b=>b.addEventListener(
    'click',()=>insert(b.dataset.insert)
  ));

$('backspace').addEventListener(
  'click',()=>{
    const el=active;
    let a=el.selectionStart??0;
    let b=el.selectionEnd??a;

    if(a===b && a>0) a--;

    el.value=
      el.value.slice(0,a)+
      el.value.slice(b);

    el.focus();
    el.setSelectionRange(a,a);
    clearFeedback();
  }
);

$('clear').addEventListener(
  'click',()=>{
    if(mode==='fraction') {
      num.value='';
      den.value='';
      num.focus();
    } else {
      plain.value='';
      plain.focus();
    }
    clearFeedback();
  }
);

$('submit').addEventListener(
  'click',submit
);

$('next').addEventListener(
  'click',reset
);

$('show').addEventListener(
  'click',()=>{
    showing=!showing;
    $('solution').hidden=!showing;

    $('show').textContent=
      showing?'Hide Solution':'Show Solution';

    $('show').setAttribute(
      'aria-expanded',String(showing)
    );

    if(showing)
      typeset([$('solution')]);
  }
);

$('theme').addEventListener(
  'click',()=>{
    const light=app.classList.toggle(
      'light'
    );

    $('theme').textContent=
      light?'Dark mode':'Light mode';
  }
);

reset();

})();
</script>
</body>
</html>
