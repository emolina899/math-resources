
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Matrix Addition and Subtraction</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"]]
  },
  svg: {
    fontCache: "global"
  }
};
</script>

<script defer
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101827;
  --panel: #1c2a45;
  --field: #192841;
  --text: #f6f7ff;
  --muted: #b5c4df;
  --border: #425679;
  --soft: #2c4165;
  --good: #86e9b7;
  --bad: #ff9ea9;
  --accent: #8772ff;
}

body.light {
  --bg: #ffffff;
  --panel: #eff2ff;
  --field: #ffffff;
  --text: #18243c;
  --muted: #52627e;
  --border: #c5cfe2;
  --soft: #e4eafa;
  --good: #167447;
  --bad: #b82f45;
}

body {
  margin: 0;
  padding: 12px;
  background: var(--bg);
  color: var(--text);
  font: 15px Arial, sans-serif;
}

.app {
  max-width: 800px;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

.theme {
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 8px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.problem {
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 15px;
  padding: 22px 12px;
  text-align: center;
}

.prompt {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
}

.matrix-display {
  font-size: 22px;
  text-align: center;
  width: 100%;
  min-width: 0;
}

.operation-display {
  margin-top: 12px;
  font-size: 24px;
  text-align: center;
}

/* Remove internal scrollbars */

.matrix-display,
.operation-display,
.work,
.problem,
.solution,
.step {
  overflow: visible !important;
}

mjx-container {
  overflow: visible !important;
}

.matrix-display mjx-container,
.operation-display mjx-container,
.work mjx-container {
  max-width: 100%;
}

/* Keep MathJax SVGs responsive */

.matrix-display mjx-container svg,
.operation-display mjx-container svg,
.work mjx-container svg {
  max-width: 100%;
  height: auto;
}

.answer-section {
  margin: 18px 0;
}

.answer-label {
  display: block;
  text-align: center;
  font-weight: bold;
  margin-bottom: 12px;
}

.matrix-input-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  max-width: 100%;
}

.matrix-bracket {
  width: 10px;
  align-self: stretch;
  border-top: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
}

.matrix-bracket.left {
  border-left: 2px solid var(--text);
}

.matrix-bracket.right {
  border-right: 2px solid var(--text);
}

.matrix-grid {
  display: grid;
  gap: 7px;
  max-width: calc(100% - 34px);
}

.matrix-cell {
  width: 65px;
  min-width: 0;
  padding: 10px 4px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  font: 15px Arial, sans-serif;
  outline: none;
}

.matrix-cell:focus {
  border-color: var(--accent);
}

.matrix-cell:disabled {
  opacity: 0.4;
}

.not-possible {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  margin-top: 15px;
  cursor: pointer;
}

.not-possible input {
  width: 17px;
  height: 17px;
  accent-color: var(--accent);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.submit {
  background: linear-gradient(
    100deg, #905cf6, #6258ed
  );
  color: white;
}

.next {
  background: #31568d;
  color: white;
}

.reveal {
  width: 100%;
  margin-top: 9px;
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  min-height: 18px;
  margin: 12px 0;
  text-align: center;
  font-weight: bold;
}

.good {
  color: var(--good);
}

.bad {
  color: var(--bad);
}

.solution {
  display: none;
  margin-top: 12px;
  padding: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.step {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.step:last-child {
  border-bottom: 0;
}

.step-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.work {
  font-size: 19px;
  text-align: center;
  padding: 5px 0;
  width: 100%;
  min-width: 0;
}

@media(max-width: 480px) {
  body {
    padding: 8px;
  }

  .problem {
    padding: 18px 8px;
  }

  .matrix-display {
    font-size: 17px;
  }

  .operation-display {
    font-size: 20px;
  }

  .work {
    font-size: 15px;
  }

  .matrix-cell {
    width: 49px;
    padding: 9px 2px;
    font-size: 13px;
  }

  .matrix-grid {
    gap: 5px;
  }

  .solution {
    padding: 10px;
  }

  button {
    font-size: 13px;
  }
}
</style>
</head>

<body>
<main class="app">

<div class="top">
  <strong>Perform the indicated matrix operation.</strong>

  <button id="theme" class="theme">
    Light mode
  </button>
</div>

<div class="problem">

  <div class="prompt">
    Evaluate the expression, if possible.
  </div>

  <div id="matrixDisplay"
       class="matrix-display"></div>

  <div id="operationDisplay"
       class="operation-display"></div>

</div>

<div class="answer-section">

  <label class="answer-label">
    Enter the resulting matrix.
  </label>

  <div class="matrix-input-wrap">

    <span class="matrix-bracket left"></span>

    <div id="matrixGrid"
         class="matrix-grid"></div>

    <span class="matrix-bracket right"></span>

  </div>

  <label class="not-possible">
    <input type="checkbox" id="notPossible">
    Not Possible
  </label>

</div>

<div class="actions">
  <button id="submit" class="submit">
    Submit
  </button>

  <button id="next" class="next">
    Try Similar
  </button>
</div>

<button id="reveal" class="reveal">
  Show Solution
</button>

<div id="feedback"
     class="feedback"
     aria-live="polite"></div>

<div id="solution"
     class="solution"></div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const rand = (a,b) =>
  Math.floor(Math.random()*(b-a+1))+a;

const tex = s => "\\(" + s + "\\)";

let problems = [];
let current = null;
let last = -1;
let shown = false;

// -------------------------------
// MATRIX UTILITIES
// -------------------------------

function randomMatrix(rows,cols) {
  return Array.from(
    {length:rows},
    () => Array.from(
      {length:cols},
      () => rand(-9,9)
    )
  );
}

function matrixTex(M) {
  const rows = M.map(
    row => row.join("&")
  ).join("\\\\");

  return "\\begin{bmatrix}"+
    rows+
    "\\end{bmatrix}";
}

function expressionMatrixTex(A,B,operation) {
  return A.map((row,i)=>
    row.map((value,j)=>{
      const other=B[i][j];

      if(operation==="+") {
        return value+
          (other<0 ?
            "+("+other+")" :
            "+"+other);
      }

      return value+
        (other<0 ?
          "-("+other+")" :
          "-"+other);
    })
  );
}

function sameDimensions(A,B) {
  return A.length===B.length &&
    A[0].length===B[0].length;
}

function calculate(A,B,operation) {
  if(!sameDimensions(A,B)) {
    return null;
  }

  return A.map((row,i)=>
    row.map((value,j)=>
      operation==="+" ?
        value+B[i][j] :
        value-B[i][j]
    )
  );
}

// -------------------------------
// GENERATE 50 QUESTIONS
// -------------------------------

function generate() {
  const seen = new Set();

  while(problems.length<50) {
    const rowsA=rand(2,4);
    const colsA=rand(2,4);

    const incompatible=
      Math.random()<0.25;

    let rowsB=rowsA;
    let colsB=colsA;

    if(incompatible) {
      do {
        rowsB=rand(2,4);
        colsB=rand(2,4);
      } while(
        rowsB===rowsA &&
        colsB===colsA
      );
    }

    const A=randomMatrix(rowsA,colsA);
    const B=randomMatrix(rowsB,colsB);

    const operation=
      Math.random()<0.5 ? "+" : "-";

    const key=JSON.stringify({
      A,B,operation
    });

    if(seen.has(key)) continue;
    seen.add(key);

    problems.push({
      A,B,operation,
      result:calculate(A,B,operation)
    });
  }
}

// -------------------------------
// MATHJAX RENDERING
// -------------------------------

let mathQueue = Promise.resolve();

function typeset(el) {
  mathQueue = mathQueue.then(async()=>{
    if(!window.MathJax) return;

    await MathJax.startup.promise;

    MathJax.typesetClear([el]);

    await MathJax.typesetPromise([el]);

    fitMath(el);
  }).catch(console.error);

  return mathQueue;
}

// Scale mathematical expressions
// without creating scrollbars.

function fitMath(parent) {
  parent.querySelectorAll("mjx-container")
    .forEach(container => {

      container.style.transform = "";
      container.style.width = "";
      container.style.transformOrigin =
        "center center";

      const available =
        parent.clientWidth-16;

      const actual =
        container.scrollWidth;

      if(
        actual>available &&
        available>0
      ) {
        const scale=available/actual;

        container.style.transform =
          "scale("+scale+")";

        container.style.width =
          (100/scale)+"%";
      }
    });
}

// -------------------------------
// INPUT GRID
// -------------------------------

function createGrid(rows,cols) {
  const grid=$("matrixGrid");

  grid.replaceChildren();

  grid.style.gridTemplateColumns =
    `repeat(${cols},minmax(0,1fr))`;

  for(let i=0;i<rows;i++) {
    for(let j=0;j<cols;j++) {
      const input=document.createElement("input");

      input.type="text";
      input.className="matrix-cell";
      input.autocomplete="off";

      input.setAttribute(
        "aria-label",
        `Row ${i+1}, column ${j+1}`
      );

      input.dataset.row=i;
      input.dataset.col=j;

      input.addEventListener("keydown",e=>{
        if(e.key==="Enter") check();
      });

      grid.append(input);
    }
  }
}

function setInputsDisabled(disabled) {
  document.querySelectorAll(".matrix-cell")
    .forEach(input=>{
      input.disabled=disabled;
    });
}

// -------------------------------
// NEW PROBLEM
// -------------------------------

function newProblem() {
  let i;

  do {
    i=rand(0,problems.length-1);
  } while(i===last);

  last=i;
  current=problems[i];
  shown=false;

  $("matrixDisplay").textContent=tex(
    "A="+matrixTex(current.A)+
    "\\qquad B="+matrixTex(current.B)
  );

  $("operationDisplay").textContent=tex(
    "A"+current.operation+"B"
  );

  createGrid(
    current.A.length,
    current.A[0].length
  );

  $("notPossible").checked=false;
  setInputsDisabled(false);

  $("feedback").textContent="";
  $("feedback").className="feedback";

  $("solution").style.display="none";
  $("solution").replaceChildren();

  $("reveal").textContent="Show Solution";

  typeset($("matrixDisplay"));
  typeset($("operationDisplay"));
}

// -------------------------------
// ANSWER CHECKING
// -------------------------------

function parseInteger(raw) {
  const s=raw.trim();

  if(!/^[+-]?\d+$/.test(s)) {
    return null;
  }

  const n=Number(s);

  return Number.isSafeInteger(n) ? n : null;
}

function check() {
  const fb=$("feedback");

  if(current.result===null) {
    const correct=$("notPossible").checked;

    fb.textContent=correct ?
      "Correct! The matrices have different dimensions." :
      "Incorrect. Check the dimensions of both matrices.";

    fb.className=
      "feedback "+(correct?"good":"bad");

    return;
  }

  if($("notPossible").checked) {
    fb.textContent=
      "Incorrect. These matrices have compatible dimensions.";

    fb.className="feedback bad";
    return;
  }

  const inputs=[
    ...document.querySelectorAll(".matrix-cell")
  ];

  const correct=inputs.every(input=>{
    const row=Number(input.dataset.row);
    const col=Number(input.dataset.col);

    return parseInteger(input.value)===
      current.result[row][col];
  });

  fb.textContent=correct ?
    "Correct! Every matrix entry is correct." :
    "Incorrect. Check your matrix calculations.";

  fb.className=
    "feedback "+(correct?"good":"bad");
}

// -------------------------------
// WORKED SOLUTION
// -------------------------------

function addStep(container,label,math) {
  const step=document.createElement("div");
  step.className="step";

  const heading=document.createElement("div");
  heading.className="step-title";
  heading.textContent=label;

  const work=document.createElement("div");
  work.className="work";
  work.textContent=tex(math);

  step.append(heading,work);
  container.append(step);
}

function showSolution() {
  shown=!shown;

  const el=$("solution");

  el.style.display=shown?"block":"none";

  $("reveal").textContent=
    shown?"Hide Solution":"Show Solution";

  if(!shown) return;

  el.replaceChildren();

  const heading=document.createElement("strong");
  heading.textContent="Step-by-step solution";
  el.append(heading);

  const {A,B,operation,result}=current;

  if(result===null) {
    addStep(
      el,
      "Compare the dimensions.",
      `A:\\ ${A.length}\\times${A[0].length}
       \\qquad
       B:\\ ${B.length}\\times${B[0].length}`
    );

    const note=document.createElement("p");

    note.textContent=
      "Not Possible. Matrix addition and subtraction require both matrices to have identical dimensions.";

    el.append(note);

    typeset(el);
    return;
  }

  const expressions=
    expressionMatrixTex(A,B,operation);

  addStep(
    el,
    "Add or subtract corresponding entries.",
    matrixTex(A)+
    operation+
    matrixTex(B)+
    "="+
    matrixTex(expressions)+
    "="+
    matrixTex(result)
  );

  typeset(el);
}

// -------------------------------
// EVENTS
// -------------------------------

$("theme").onclick=()=>{
  const light=
    document.body.classList.toggle("light");

  $("theme").textContent=
    light?"Dark mode":"Light mode";
};

$("notPossible").onchange=()=>{
  setInputsDisabled($("notPossible").checked);
};

$("submit").onclick=check;
$("next").onclick=newProblem;
$("reveal").onclick=showSolution;

generate();
newProblem();

</script>
</body>
</html>
