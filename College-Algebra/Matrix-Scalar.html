
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Addition and Subtraction Practice</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"]]
  },
  svg: {
    fontCache: "global"
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101827;
  --panel: #1c2a45;
  --field: #192841;
  --text: #f6f7ff;
  --muted: #b5c4df;
  --border: #425679;
  --soft: #2c4165;
  --good: #86e9b7;
  --bad: #ff9ea9;
  --accent: #8772ff;
}

body.light {
  --bg: #ffffff;
  --panel: #eff2ff;
  --field: #ffffff;
  --text: #18243c;
  --muted: #52627e;
  --border: #c5cfe2;
  --soft: #e4eafa;
  --good: #167447;
  --bad: #b82f45;
}

html, body {
  width: 100%;
  margin: 0;
  overflow-x: hidden;
}

body {
  padding: 8px;
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 800px;
  min-width: 0;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.top strong {
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

.theme {
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  white-space: nowrap;
}

.problem {
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 12px 10px 10px;
  text-align: center;
  min-width: 0;
}

.prompt {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 6px;
}

.matrix-definitions {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  column-gap: 22px;
  row-gap: 6px;
  width: 100%;
}

.matrix-definition {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.matrix-name {
  font: italic 21px Georgia, serif;
  white-space: nowrap;
}

.operation-display {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--border);
  font-size: 21px;
}

.math-line {
  width: 100%;
  min-width: 0;
  text-align: center;
  overflow: visible;
}

.math-line mjx-container {
  display: inline-block !important;
  max-width: none !important;
  overflow: visible !important;
}

/* Compact answer area */

.answer-section {
  margin: 10px 0 11px;
}

.answer-heading {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 9px;
}

.answer-label {
  font-size: 13px;
  font-weight: bold;
}

.not-possible {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

.not-possible input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--accent);
}

.matrix-input-wrap {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 5px;
  max-width: 100%;
}

.matrix-bracket {
  width: 8px;
  flex: 0 0 8px;
  border-top: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
}

.matrix-bracket.left {
  border-left: 2px solid var(--text);
}

.matrix-bracket.right {
  border-right: 2px solid var(--text);
}

.matrix-grid {
  display: grid;
  gap: 5px;
  max-width: calc(100% - 26px);
}

.matrix-cell {
  width: 48px;
  min-width: 0;
  height: 35px;
  padding: 5px 2px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  text-align: center;
  font: 13px Arial, sans-serif;
  outline: none;
}

.matrix-cell:focus {
  border-color: var(--accent);
}

.matrix-cell:disabled {
  opacity: 0.35;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.submit {
  background: linear-gradient(100deg,#905cf6,#6258ed);
  color: white;
}

.next {
  background: #31568d;
  color: white;
}

.reveal {
  width: 100%;
  margin-top: 7px;
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  margin: 8px 0 0;
  text-align: center;
  font-weight: bold;
  line-height: 1.4;
}

.feedback:empty {
  display: none;
}

.good { color: var(--good); }
.bad { color: var(--bad); }

.solution {
  display: none;
  margin-top: 10px;
  padding: 11px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  min-width: 0;
}

.solution-heading {
  font-weight: bold;
  margin-bottom: 7px;
}

.step {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.step:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.step-title {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 7px;
}

.matrix-row {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.matrix-piece {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 0;
}

.operator {
  font: 22px Georgia, serif;
  flex-shrink: 0;
}

.work {
  font-size: 17px;
  text-align: center;
  padding: 2px 0;
}

.arithmetic-matrix {
  font-size: 15px;
}

.solution-note {
  font-size: 13px;
  line-height: 1.5;
  margin: 5px 0 0;
}

@media (max-width: 480px) {
  body { padding: 6px; }

  .top strong { font-size: 12px; }

  .problem { padding: 10px 6px 8px; }

  .matrix-definitions {
    column-gap: 12px;
  }

  .matrix-name { font-size: 18px; }

  .operation-display { font-size: 19px; }

  .work { font-size: 15px; }

  .arithmetic-matrix { font-size: 13px; }

  .matrix-cell {
    width: 43px;
    height: 32px;
    font-size: 12px;
  }

  .matrix-grid { gap: 4px; }

  .solution { padding: 9px; }

  button {
    font-size: 12px;
    padding: 8px 6px;
  }
}
</style>
</head>

<body>
<main class="app">

<div class="top">
  <strong>Perform the indicated matrix operation.</strong>
  <button id="theme" class="theme" type="button">
    Light mode
  </button>
</div>

<div class="problem">
  <div class="prompt">
    Evaluate the expression, if possible.
  </div>

  <div class="matrix-definitions">
    <div class="matrix-definition">
      <span class="matrix-name">A =</span>
      <span id="matrixA" class="math-line"></span>
    </div>

    <div class="matrix-definition">
      <span class="matrix-name">B =</span>
      <span id="matrixB" class="math-line"></span>
    </div>
  </div>

  <div id="operationDisplay"
       class="operation-display math-line"></div>
</div>

<div class="answer-section">
  <div class="answer-heading">
    <span class="answer-label">
      Enter the resulting matrix.
    </span>

    <label class="not-possible">
      <input type="checkbox" id="notPossible">
      Not Possible
    </label>
  </div>

  <div class="matrix-input-wrap">
    <span class="matrix-bracket left"></span>
    <div id="matrixGrid" class="matrix-grid"></div>
    <span class="matrix-bracket right"></span>
  </div>
</div>

<div class="actions">
  <button id="submit" class="submit" type="button">
    Submit
  </button>

  <button id="next" class="next" type="button">
    Try Similar
  </button>
</div>

<button id="reveal" class="reveal" type="button">
  Show Solution
</button>

<div id="feedback" class="feedback" aria-live="polite"></div>
<div id="solution" class="solution"></div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const rand = (a,b) =>
  Math.floor(Math.random() * (b-a+1)) + a;

const tex = s => "\\(" + s + "\\)";

let problems = [];
let current = null;
let last = -1;
let shown = false;

// ----------------------------------
// MATRIX UTILITIES
// ----------------------------------

function randomMatrix(rows,cols) {
  return Array.from(
    {length:rows},
    () => Array.from(
      {length:cols},
      () => rand(-9,9)
    )
  );
}

function matrixTex(M) {
  return "\\begin{bmatrix}" +
    M.map(row=>row.join("&")).join("\\\\") +
    "\\end{bmatrix}";
}

function sameDimensions(A,B) {
  return A.length===B.length &&
    A[0].length===B[0].length;
}

function calculate(A,B,operation) {
  if(!sameDimensions(A,B)) return null;

  return A.map((row,i)=>
    row.map((value,j)=>
      operation==="+" ?
        value+B[i][j] :
        value-B[i][j]
    )
  );
}

function arithmeticEntry(a,b,operation) {
  if(operation==="+") {
    return a + (b<0 ? "+("+b+")" : "+"+b);
  }

  return a + (b<0 ? "-("+b+")" : "-"+b);
}

function arithmeticMatrix(A,B,operation) {
  return A.map((row,i)=>
    row.map((value,j)=>
      arithmeticEntry(value,B[i][j],operation)
    )
  );
}

// ----------------------------------
// GENERATE 50 RANDOM PROBLEMS
// ----------------------------------

function generate() {
  const seen = new Set();

  while(problems.length<50) {
    const rowsA=rand(2,4);
    const colsA=rand(2,4);

    const incompatible=Math.random()<0.25;

    let rowsB=rowsA;
    let colsB=colsA;

    if(incompatible) {
      do {
        rowsB=rand(2,4);
        colsB=rand(2,4);
      } while(rowsB===rowsA && colsB===colsA);
    }

    const A=randomMatrix(rowsA,colsA);
    const B=randomMatrix(rowsB,colsB);
    const operation=Math.random()<0.5?"+":"-";

    const key=JSON.stringify({A,B,operation});
    if(seen.has(key)) continue;
    seen.add(key);

    problems.push({
      A,B,operation,
      result:calculate(A,B,operation)
    });
  }
}

// ----------------------------------
// RESPONSIVE MATHJAX
// ----------------------------------

let mathQueue=Promise.resolve();

function typeset(element) {
  mathQueue=mathQueue.then(async()=>{
    if(!window.MathJax) return;

    await MathJax.startup.promise;
    MathJax.typesetClear([element]);
    await MathJax.typesetPromise([element]);

    fitAllMath(element);
  }).catch(console.error);

  return mathQueue;
}

/*
  Fit MathJax using font-size only.
  No transform:scale(), no artificial
  widths, and no horizontal scrollbars.
*/

function fitAllMath(parent) {
  const targets = [];

  if(parent.classList &&
     parent.classList.contains("math-line")) {
    targets.push(parent);
  }

  targets.push(
    ...parent.querySelectorAll(".math-line")
  );

  targets.forEach(fitMathLine);
}

function fitMathLine(element) {
  const container=element.querySelector("mjx-container");
  if(!container) return;

  element.style.fontSize="";
  const initialSize=parseFloat(
    getComputedStyle(element).fontSize
  );

  let size=initialSize;
  const minSize=10;
  const available=element.clientWidth-6;

  while(
    container.getBoundingClientRect().width>available &&
    size>minSize
  ) {
    size-=0.5;
    element.style.fontSize=size+"px";
  }
}

// ----------------------------------
// ANSWER GRID
// ----------------------------------

function createGrid(rows,cols) {
  const grid=$("matrixGrid");
  grid.replaceChildren();

  grid.style.gridTemplateColumns=
    `repeat(${cols},minmax(0,1fr))`;

  for(let i=0;i<rows;i++) {
    for(let j=0;j<cols;j++) {
      const input=document.createElement("input");

      input.type="text";
      input.className="matrix-cell";
      input.autocomplete="off";
      input.inputMode="numeric";

      input.dataset.row=i;
      input.dataset.col=j;

      input.setAttribute(
        "aria-label",
        `Row ${i+1}, column ${j+1}`
      );

      input.addEventListener("keydown",e=>{
        if(e.key==="Enter") check();
      });

      grid.append(input);
    }
  }
}

function setInputsDisabled(disabled) {
  document.querySelectorAll(".matrix-cell")
    .forEach(input=>{
      input.disabled=disabled;
    });
}

// ----------------------------------
// NEW PROBLEM
// ----------------------------------

function newProblem() {
  let i;

  do {
    i=rand(0,problems.length-1);
  } while(i===last && problems.length>1);

  last=i;
  current=problems[i];
  shown=false;

  $("matrixA").textContent=tex(matrixTex(current.A));
  $("matrixB").textContent=tex(matrixTex(current.B));

  $("operationDisplay").textContent=tex(
    "A"+current.operation+"B"
  );

  createGrid(
    current.A.length,
    current.A[0].length
  );

  $("notPossible").checked=false;
  setInputsDisabled(false);

  $("feedback").textContent="";
  $("feedback").className="feedback";

  $("solution").style.display="none";
  $("solution").replaceChildren();

  $("reveal").textContent="Show Solution";

  typeset($("matrixA"));
  typeset($("matrixB"));
  typeset($("operationDisplay"));
}

// ----------------------------------
// ANSWER CHECKING
// ----------------------------------

function parseInteger(raw) {
  const s=raw.trim();
  if(!/^[+-]?\d+$/.test(s)) return null;

  const n=Number(s);
  return Number.isSafeInteger(n)?n:null;
}

function check() {
  const fb=$("feedback");

  if(current.result===null) {
    const correct=$("notPossible").checked;

    fb.textContent=correct ?
      "Correct! The matrices have incompatible dimensions." :
      "Incorrect. Check the matrix dimensions.";

    fb.className="feedback "+(correct?"good":"bad");
    return;
  }

  if($("notPossible").checked) {
    fb.textContent=
      "Incorrect. These matrices have compatible dimensions.";
    fb.className="feedback bad";
    return;
  }

  const inputs=[
    ...document.querySelectorAll(".matrix-cell")
  ];

  const correct=inputs.every(input=>{
    const i=Number(input.dataset.row);
    const j=Number(input.dataset.col);

    return parseInteger(input.value)===
      current.result[i][j];
  });

  fb.textContent=correct ?
    "Correct! Every matrix entry is correct." :
    "Incorrect. Check your matrix calculations.";

  fb.className="feedback "+(correct?"good":"bad");
}

// ----------------------------------
// SOLUTION BUILDERS
// ----------------------------------

function addStep(container,title) {
  const step=document.createElement("div");
  step.className="step";

  const heading=document.createElement("div");
  heading.className="step-title";
  heading.textContent=title;

  step.append(heading);
  container.append(step);

  return step;
}

function addMath(step,latex,className="work") {
  const line=document.createElement("div");
  line.className=className+" math-line";
  line.textContent=tex(latex);
  step.append(line);
}

function addMatrixRow(step,items) {
  const row=document.createElement("div");
  row.className="matrix-row";

  items.forEach(item=>{
    if(item.type==="operator") {
      const symbol=document.createElement("span");
      symbol.className="operator";
      symbol.textContent=item.value;
      row.append(symbol);
    } else {
      const piece=document.createElement("div");
      piece.className="matrix-piece";

      const math=document.createElement("span");
      math.className="math-line";
      math.textContent=tex(item.value);

      piece.append(math);
      row.append(piece);
    }
  });

  step.append(row);
}

function addNote(container,message) {
  const note=document.createElement("p");
  note.className="solution-note";
  note.textContent=message;
  container.append(note);
}

// ----------------------------------
// WORKED SOLUTION
// ----------------------------------

function showSolution() {
  shown=!shown;

  const el=$("solution");
  el.style.display=shown?"block":"none";
  $("reveal").textContent=
    shown?"Hide Solution":"Show Solution";

  if(!shown) return;

  el.replaceChildren();

  const heading=document.createElement("div");
  heading.className="solution-heading";
  heading.textContent="Step-by-step solution";
  el.append(heading);

  const {A,B,operation,result}=current;

  if(result===null) {
    const step=addStep(
      el,
      "Compare the matrix dimensions."
    );

    addMath(
      step,
      `A:\\ ${A.length}\\times${A[0].length}
       \\qquad
       B:\\ ${B.length}\\times${B[0].length}`
    );

    addNote(
      el,
      "Not Possible. Matrix addition and subtraction require identical dimensions."
    );

    typeset(el);
    return;
  }

  // Step 1: Show the original matrices
  // as separate responsive elements.

  const step1=addStep(
    el,
    "Step 1: Identify corresponding entries."
  );

  addMatrixRow(step1,[
    {type:"matrix",value:matrixTex(A)},
    {type:"operator",value:operation},
    {type:"matrix",value:matrixTex(B)}
  ]);

  // Step 2: Show only the arithmetic
  // matrix, avoiding long expressions.

  const step2=addStep(
    el,
    "Step 2: Add or subtract each pair of entries."
  );

  addMath(
    step2,
    matrixTex(arithmeticMatrix(A,B,operation)),
    "work arithmetic-matrix"
  );

  // Step 3: Final answer.

  const step3=addStep(
    el,
    "Step 3: Simplify to obtain the resulting matrix."
  );

  addMath(step3,matrixTex(result));

  typeset(el);
}

// ----------------------------------
// EVENTS
// ----------------------------------

$("theme").onclick=()=>{
  const light=document.body.classList.toggle("light");
  $("theme").textContent=
    light?"Dark mode":"Light mode";
};

$("notPossible").onchange=()=>{
  setInputsDisabled($("notPossible").checked);
};

$("submit").onclick=check;
$("next").onclick=newProblem;
$("reveal").onclick=showSolution;

window.addEventListener("resize",()=>{
  fitAllMath(document.querySelector(".app"));
});

generate();
newProblem();
</script>
</body>
</html>
