
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Scalar Operations</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"]]
  },
  svg: {
    fontCache: "global"
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #101827;
  --panel: #1c2a45;
  --field: #192841;
  --text: #f6f7ff;
  --muted: #b5c4df;
  --border: #425679;
  --soft: #2c4165;
  --good: #86e9b7;
  --bad: #ff9ea9;
  --accent: #8772ff;
}

body.light {
  --bg: #ffffff;
  --panel: #eff2ff;
  --field: #ffffff;
  --text: #18243c;
  --muted: #52627e;
  --border: #c5cfe2;
  --soft: #e4eafa;
  --good: #167447;
  --bad: #b82f45;
}

body {
  margin: 0;
  padding: 8px;
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
}

.app {
  max-width: 800px;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.top strong {
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

.theme {
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  white-space: nowrap;
}

.problem {
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 12px 10px 10px;
  text-align: center;
}

.prompt {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}

.matrix-display {
  font-size: 19px;
  width: 100%;
  text-align: center;
}

.operation-display {
  margin-top: 6px;
  padding-top: 7px;
  border-top: 1px solid var(--border);
  font-size: 21px;
  text-align: center;
}

/* No internal scrollbars */

.problem,
.matrix-display,
.operation-display,
.solution,
.step,
.work {
  overflow: visible !important;
}

mjx-container {
  overflow: visible !important;
}

/* A dedicated fitting wrapper prevents
   MathJax from creating scroll controls. */

.math-fit {
  width: 100%;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: visible;
}

.math-inner {
  display: inline-block;
  max-width: none;
  transform-origin: center center;
}

/* Compact answer area */

.answer-section {
  margin: 10px 0 11px;
}

.answer-heading {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 9px;
}

.answer-label {
  font-weight: bold;
  font-size: 13px;
}

.not-possible {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

.not-possible input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--accent);
}

.matrix-input-wrap {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 5px;
  max-width: 100%;
}

.matrix-bracket {
  width: 8px;
  flex: 0 0 8px;
  border-top: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
}

.matrix-bracket.left {
  border-left: 2px solid var(--text);
}

.matrix-bracket.right {
  border-right: 2px solid var(--text);
}

.matrix-grid {
  display: grid;
  gap: 5px;
  max-width: calc(100% - 26px);
}

.matrix-cell {
  width: 48px;
  min-width: 0;
  height: 35px;
  padding: 5px 2px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  text-align: center;
  font: 13px Arial, sans-serif;
  outline: none;
}

.matrix-cell:focus {
  border-color: var(--accent);
}

.matrix-cell:disabled {
  opacity: 0.35;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.submit {
  background: linear-gradient(100deg, #905cf6, #6258ed);
  color: white;
}

.next {
  background: #31568d;
  color: white;
}

.reveal {
  width: 100%;
  margin-top: 7px;
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  margin: 8px 0 0;
  text-align: center;
  font-weight: bold;
  line-height: 1.4;
}

.feedback:empty {
  display: none;
}

.good { color: var(--good); }
.bad { color: var(--bad); }

.solution {
  display: none;
  margin-top: 10px;
  padding: 11px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.solution-heading {
  font-weight: bold;
  margin-bottom: 7px;
}

.step {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.step:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.step-title {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.work {
  width: 100%;
  font-size: 17px;
  text-align: center;
  padding: 2px 0;
}

.solution-note {
  font-size: 13px;
  line-height: 1.5;
  margin: 5px 0 0;
}

@media (max-width: 480px) {
  body { padding: 6px; }

  .top strong { font-size: 12px; }

  .problem {
    padding: 10px 5px 8px;
  }

  .matrix-display { font-size: 15px; }
  .operation-display { font-size: 18px; }
  .work { font-size: 14px; }

  .matrix-cell {
    width: 43px;
    height: 32px;
    font-size: 12px;
  }

  .matrix-grid { gap: 4px; }
  .solution { padding: 9px; }

  button {
    font-size: 12px;
    padding: 8px 6px;
  }
}
</style>
</head>

<body>
<main class="app">

<div class="top">
  <strong>Perform the indicated matrix operation.</strong>
  <button id="theme" class="theme" type="button">
    Light mode
  </button>
</div>

<div class="problem">
  <div class="prompt">
    Evaluate the expression, if possible.
  </div>

  <div id="matrixDisplay"
       class="matrix-display math-fit">
    <div class="math-inner"></div>
  </div>

  <div id="operationDisplay"
       class="operation-display math-fit">
    <div class="math-inner"></div>
  </div>
</div>

<div class="answer-section">
  <div class="answer-heading">
    <span class="answer-label">
      Enter the resulting matrix.
    </span>

    <label class="not-possible">
      <input type="checkbox" id="notPossible">
      Not Possible
    </label>
  </div>

  <div class="matrix-input-wrap">
    <span class="matrix-bracket left"></span>
    <div id="matrixGrid" class="matrix-grid"></div>
    <span class="matrix-bracket right"></span>
  </div>
</div>

<div class="actions">
  <button id="submit" class="submit" type="button">
    Submit
  </button>

  <button id="next" class="next" type="button">
    Try Similar
  </button>
</div>

<button id="reveal" class="reveal" type="button">
  Show Solution
</button>

<div id="feedback" class="feedback" aria-live="polite"></div>
<div id="solution" class="solution"></div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const rand = (a,b) =>
  Math.floor(Math.random() * (b-a+1)) + a;
const tex = s => "\\(" + s + "\\)";

let problems = [];
let current = null;
let last = -1;
let shown = false;

// ----------------------------------
// MATRIX UTILITIES
// ----------------------------------

function randomMatrix(rows,cols) {
  return Array.from(
    {length:rows},
    () => Array.from(
      {length:cols},
      () => rand(-9,9)
    )
  );
}

function matrixTex(M) {
  return "\\begin{bmatrix}" +
    M.map(row=>row.join("&")).join("\\\\") +
    "\\end{bmatrix}";
}

function sameDimensions(A,B) {
  return A.length===B.length &&
         A[0].length===B[0].length;
}

function scaleMatrix(M,k) {
  return M.map(row=>row.map(v=>k*v));
}

function combineMatrices(A,B,sign) {
  if(!sameDimensions(A,B)) return null;

  return A.map((row,i)=>
    row.map((v,j)=>v+sign*B[i][j])
  );
}

function signedTerm(coefficient,name,first=false) {
  if(coefficient===0) return "";

  const magnitude=Math.abs(coefficient);
  const body=(magnitude===1?"":magnitude)+name;

  if(first) {
    return coefficient<0?"-"+body:body;
  }

  return coefficient<0?"-"+body:"+"+body;
}

function expressionTex(p) {
  const first=p.swapped?"B":"A";
  const second=p.swapped?"A":"B";

  if(p.grouped) {
    const inside=first+
      (p.sign===1?"+":"-")+second;

    const scalar=p.k===1?"":p.k===-1?"-":p.k;

    return scalar+"("+inside+")";
  }

  return signedTerm(p.k,first,true)+
    signedTerm(p.m,second,false);
}

function evaluateProblem(p) {
  if(!sameDimensions(p.A,p.B)) return null;

  const first=p.swapped?p.B:p.A;
  const second=p.swapped?p.A:p.B;

  if(p.grouped) {
    const inside=combineMatrices(
      first,second,p.sign
    );

    return scaleMatrix(inside,p.k);
  }

  return first.map((row,i)=>
    row.map((v,j)=>
      p.k*v+p.m*second[i][j]
    )
  );
}

// ----------------------------------
// GENERATE 50 PROBLEMS
// ----------------------------------

function generate() {
  const seen=new Set();

  while(problems.length<50) {
    const rowsA=rand(2,4);
    const colsA=rand(2,4);

    const incompatible=Math.random()<0.25;

    let rowsB=rowsA;
    let colsB=colsA;

    if(incompatible) {
      do {
        rowsB=rand(2,4);
        colsB=rand(2,4);
      } while(rowsB===rowsA && colsB===colsA);
    }

    const A=randomMatrix(rowsA,colsA);
    const B=randomMatrix(rowsB,colsB);

    const swapped=Math.random()<0.5;
    const grouped=Math.random()<0.33;

    const kChoices=[-5,-4,-3,-2,-1,1,2,3,4,5];
    const mChoices=[-5,-4,-3,-2,-1,1,2,3,4,5];

    const k=kChoices[rand(0,kChoices.length-1)];
    const m=mChoices[rand(0,mChoices.length-1)];

    const sign=Math.random()<0.5?1:-1;

    const p={
      A,B,swapped,grouped,k,m,sign
    };

    const key=JSON.stringify(p);
    if(seen.has(key)) continue;

    seen.add(key);
    p.result=evaluateProblem(p);
    problems.push(p);
  }
}

// ----------------------------------
// RESPONSIVE MATHJAX
// ----------------------------------

let mathQueue=Promise.resolve();

function setMath(wrapper,latex) {
  const inner=wrapper.querySelector(".math-inner");
  inner.textContent=tex(latex);
  return typeset(wrapper);
}

function typeset(element) {
  mathQueue=mathQueue.then(async()=>{
    if(!window.MathJax) return;

    await MathJax.startup.promise;
    MathJax.typesetClear([element]);
    await MathJax.typesetPromise([element]);

    fitMath(element);
  }).catch(console.error);

  return mathQueue;
}

function fitMath(parent) {
  const wrappers=parent.classList.contains("math-fit")
    ? [parent]
    : [...parent.querySelectorAll(".math-fit")];

  wrappers.forEach(wrapper=>{
    const inner=wrapper.querySelector(".math-inner");
    if(!inner) return;

    inner.style.transform="";
    inner.style.width="";
    inner.style.height="";

    const available=wrapper.clientWidth-8;
    const actual=inner.scrollWidth;

    if(actual>available && available>0) {
      const scale=available/actual;

      const originalHeight=inner.getBoundingClientRect().height;

      inner.style.transform=`scale(${scale})`;
      inner.style.width=actual+"px";
      inner.style.height=
        (originalHeight*scale)+"px";
    }
  });
}

// ----------------------------------
// ANSWER GRID
// ----------------------------------

function createGrid(rows,cols) {
  const grid=$("matrixGrid");
  grid.replaceChildren();

  grid.style.gridTemplateColumns=
    `repeat(${cols},minmax(0,1fr))`;

  for(let i=0;i<rows;i++) {
    for(let j=0;j<cols;j++) {
      const input=document.createElement("input");

      input.type="text";
      input.className="matrix-cell";
      input.autocomplete="off";
      input.inputMode="numeric";

      input.dataset.row=i;
      input.dataset.col=j;

      input.setAttribute(
        "aria-label",
        `Row ${i+1}, column ${j+1}`
      );

      input.addEventListener("keydown",e=>{
        if(e.key==="Enter") check();
      });

      grid.append(input);
    }
  }
}

function setInputsDisabled(disabled) {
  document.querySelectorAll(".matrix-cell")
    .forEach(input=>{
      input.disabled=disabled;
    });
}

// ----------------------------------
// NEW PROBLEM
// ----------------------------------

function newProblem() {
  let i;

  do {
    i=rand(0,problems.length-1);
  } while(i===last && problems.length>1);

  last=i;
  current=problems[i];
  shown=false;

  setMath(
    $("matrixDisplay"),
    "A="+matrixTex(current.A)+
    "\\qquad B="+matrixTex(current.B)
  );

  setMath(
    $("operationDisplay"),
    expressionTex(current)
  );

  createGrid(
    current.A.length,
    current.A[0].length
  );

  $("notPossible").checked=false;
  setInputsDisabled(false);

  $("feedback").textContent="";
  $("feedback").className="feedback";

  $("solution").style.display="none";
  $("solution").replaceChildren();

  $("reveal").textContent="Show Solution";
}

// ----------------------------------
// CHECK ANSWERS
// ----------------------------------

function parseInteger(raw) {
  const s=raw.trim();
  if(!/^[+-]?\d+$/.test(s)) return null;

  const n=Number(s);
  return Number.isSafeInteger(n)?n:null;
}

function check() {
  const fb=$("feedback");

  if(current.result===null) {
    const correct=$("notPossible").checked;

    fb.textContent=correct?
      "Correct! The matrices have incompatible dimensions.":
      "Incorrect. Check the matrix dimensions.";

    fb.className="feedback "+(correct?"good":"bad");
    return;
  }

  if($("notPossible").checked) {
    fb.textContent=
      "Incorrect. The operation is possible.";
    fb.className="feedback bad";
    return;
  }

  const inputs=[
    ...document.querySelectorAll(".matrix-cell")
  ];

  const correct=inputs.every(input=>{
    const i=Number(input.dataset.row);
    const j=Number(input.dataset.col);

    return parseInteger(input.value)===
      current.result[i][j];
  });

  fb.textContent=correct?
    "Correct! Every matrix entry is correct.":
    "Incorrect. Check your matrix calculations.";

  fb.className="feedback "+(correct?"good":"bad");
}

// ----------------------------------
// SOLUTION DISPLAY
// ----------------------------------

function addStep(container,label,latex) {
  const step=document.createElement("div");
  step.className="step";

  const title=document.createElement("div");
  title.className="step-title";
  title.textContent=label;

  const work=document.createElement("div");
  work.className="work math-fit";

  const inner=document.createElement("div");
  inner.className="math-inner";
  inner.textContent=tex(latex);

  work.append(inner);
  step.append(title,work);
  container.append(step);
}

function addNote(container,message) {
  const note=document.createElement("p");
  note.className="solution-note";
  note.textContent=message;
  container.append(note);
}

function showSolution() {
  shown=!shown;

  const el=$("solution");
  el.style.display=shown?"block":"none";
  $("reveal").textContent=
    shown?"Hide Solution":"Show Solution";

  if(!shown) return;

  el.replaceChildren();

  const heading=document.createElement("div");
  heading.className="solution-heading";
  heading.textContent="Step-by-step solution";
  el.append(heading);

  const p=current;

  const first=p.swapped?p.B:p.A;
  const second=p.swapped?p.A:p.B;

  if(p.result===null) {
    addStep(
      el,
      "Compare the matrix dimensions.",
      `A:\\ ${p.A.length}\\times${p.A[0].length}
       \\qquad
       B:\\ ${p.B.length}\\times${p.B[0].length}`
    );

    addNote(
      el,
      "Not Possible. The matrices must have identical dimensions for addition or subtraction."
    );

    typeset(el);
    return;
  }

  if(p.grouped) {
    const inside=combineMatrices(
      first,second,p.sign
    );

    const operation=p.sign===1?"+":"-";

    addStep(
      el,
      "Step 1: Evaluate inside parentheses.",
      matrixTex(first)+operation+
      matrixTex(second)+"="+matrixTex(inside)
    );

    addStep(
      el,
      "Step 2: Multiply every entry by the scalar.",
      p.k+matrixTex(inside)+"="+
      matrixTex(p.result)
    );
  } else {
    const firstScaled=scaleMatrix(first,p.k);
    const secondScaled=scaleMatrix(second,p.m);

    addStep(
      el,
      "Step 1: Multiply each matrix by its scalar.",
      expressionTex(p)+"="+
      matrixTex(firstScaled)+
      "+"+matrixTex(secondScaled)
    );

    addStep(
      el,
      "Step 2: Add corresponding entries.",
      matrixTex(firstScaled)+"+"+
      matrixTex(secondScaled)+"="+
      matrixTex(p.result)
    );
  }

  addStep(
    el,
    "Final answer:",
    matrixTex(p.result)
  );

  typeset(el);
}

// ----------------------------------
// EVENTS
// ----------------------------------

$("theme").onclick=()=>{
  const light=document.body.classList.toggle("light");
  $("theme").textContent=
    light?"Dark mode":"Light mode";
};

$("notPossible").onchange=()=>{
  setInputsDisabled($("notPossible").checked);
};

$("submit").onclick=check;
$("next").onclick=newProblem;
$("reveal").onclick=showSolution;

window.addEventListener("resize",()=>{
  fitMath(document.querySelector(".app"));
});

generate();
newProblem();

</script>
</body>
</html>
