
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Step Linear Equations</title>

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #101827;
  --panel: #1b2943;
  --field: #17243b;
  --text: #f5f7ff;
  --muted: #b9c6dc;
  --border: #3d5075;
  --button: #293d60;
  --accent: #7367f5;
  --success: #7ce6b0;
  --error: #ff9da9;
}

body.light {
  --bg: #ffffff;
  --panel: #eef2fc;
  --field: #ffffff;
  --text: #17233b;
  --muted: #56647b;
  --border: #c5cfe1;
  --button: #e2e8f5;
  --accent: #6255df;
  --success: #16764b;
  --error: #bd3045;
}

html, body {
  margin: 0;
  width: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
  padding: 10px;
  transition: background .2s, color .2s;
}

.activity {
  max-width: 780px;
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.prompt {
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: filter .2s, transform .15s;
}

button:hover { filter: brightness(1.1); }
button:active { transform: scale(.98); }

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.theme-btn {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.math-panel {
  background: linear-gradient(135deg, var(--panel), var(--field));
  border: 1px solid var(--accent);
  border-radius: 14px;
  min-height: 110px;
  padding: 14px 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.equation {
  width: 100%;
  font-size: 21px;
  overflow-x: auto;
  overflow-y: hidden;
}

.solution {
  display: none;
  width: 100%;
  font-size: 14px;
  line-height: 1.5;
}

.solution-title {
  font-size: 12px;
  font-weight: bold;
  color: var(--muted);
  margin-bottom: 9px;
}

.solution-step {
  margin: 8px 0;
  overflow-x: auto;
}

.solution-label {
  font-size: 12px;
  color: var(--muted);
  margin: 8px 0 3px;
}

.answer-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 12px 0 6px;
}

input {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font: inherit;
}

input::placeholder {
  color: var(--muted);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

.primary {
  background: linear-gradient(120deg, #8c5cf5, #6258eb);
  color: white;
}

.secondary {
  background: linear-gradient(120deg, #335b98, #254578);
  color: white;
}

.solution-btn {
  display: block;
  width: 100%;
  margin-top: 9px;
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--border);
}

.feedback {
  min-height: 18px;
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.correct { color: var(--success); }
.incorrect { color: var(--error); }

@media (max-width: 420px) {
  body { padding: 7px; }
  .math-panel { min-height: 100px; padding: 10px 7px; }
  .equation { font-size: 18px; }
  button { padding: 10px 8px; font-size: 13px; }
  .theme-btn { font-size: 11px; }
  input { font-size: 14px; }
}
</style>
</head>

<body>
<div class="activity">

  <div class="top">
    <span class="prompt">Solve the equation for x.</span>
   
<button class="theme-btn" id="themeBtn"
  type="button" onclick="toggleTheme()">
  ☀ Light mode
</button>
  </div>

  <div class="math-panel">
    <div class="equation" id="equation"></div>
    <div class="solution" id="solution"></div>
  </div>

  <label class="answer-label" for="answer">
    Your answer
  </label>

  <input id="answer" type="text"
    inputmode="numeric"
    placeholder="Enter an integer"
    autocomplete="off"
    spellcheck="false">

  <div class="actions">
    <button class="primary" type="button"
      onclick="checkAnswer()">Submit</button>

    <button class="secondary" type="button"
      onclick="newProblem()">Try Similar</button>
  </div>

  <button class="solution-btn" id="solutionBtn"
    type="button" onclick="toggleSolution()">
    Show Solution
  </button>

  <div class="feedback" id="feedback"
    aria-live="polite"></div>

</div>

<script>
const $ = id => document.getElementById(id);

let problem = null;
let showingSolution = false;
let previousEquation = "";

function rand(min, max) {
  return Math.floor(Math.random() * (max-min+1)) + min;
}

function nonzero(min, max) {
  let n;
  do { n = rand(min,max); } while (n === 0);
  return n;
}

function signed(n) {
  return n < 0 ? String(n) : "+" + n;
}

function xTerm(n, first = false) {
  if (n === 0) return first ? "0" : "";
  const abs = Math.abs(n);
  const term = (abs === 1 ? "" : abs) + "x";
  if (first) return n < 0 ? "-" + term : term;
  return (n < 0 ? "-" : "+") + term;
}

function linear(A, B) {
  if (A === 0) return String(B);
  let s = xTerm(A, true);
  if (B !== 0) s += signed(B);
  return s;
}

function parentheses(b) {
  return "(x" + (b < 0 ? b : "+" + b) + ")";
}

function multiplied(a, expression) {
  if (a === 1) return expression;
  if (a === -1) return "-" + expression;
  return String(a) + expression;
}

function appendConstant(expression, n) {
  if (n === 0) return expression;
  return expression + signed(n);
}

function appendX(expression, coefficient) {
  if (coefficient === 0) return expression;
  return expression + xTerm(coefficient);
}

function makeProblem() {
  const type = rand(0, 5);
  const root = nonzero(-15, 15);

  let a, b, c, d, e, f, k;
  let A, B, C, D;
  let left, right;

  // Type 0: Distributive property and like terms
  if (type === 0) {
    a = nonzero(-7, 7);
    b = nonzero(-9, 9);
    c = nonzero(-6, 6);

    A = a + c;
    if (A === 0) return makeProblem();
    B = a*b;
    C = 0;
    D = A*root+B;

    left = appendX(multiplied(a,parentheses(b)),c);
    right = String(D);
  }

  // Type 1: Combine like terms on the left
  else if (type === 1) {
    a = nonzero(-9, 9);
    c = nonzero(-9, 9);
    b = nonzero(-18, 18);
    d = nonzero(-18, 18);

    A = a+c;
    if (A === 0) return makeProblem();
    B = b+d;
    C = 0;
    D = A*root+B;

    left = xTerm(a,true) + signed(b) +
      xTerm(c) + signed(d);
    right = String(D);
  }

  // Type 2: Variables on both sides
  else if (type === 2) {
    a = nonzero(-9, 9);
    c = nonzero(-9, 9);
    if (a === c) return makeProblem();
    b = nonzero(-20, 20);

    A = a;
    B = b;
    C = c;
    D = (A-C)*root+B;

    left = linear(A,B);
    right = linear(C,D);
  }

  // Type 3: Distribute and move variables
  else if (type === 3) {
    a = nonzero(-7, 7);
    b = nonzero(-9, 9);
    c = nonzero(-15, 15);
    d = nonzero(-7, 7);
    e = nonzero(-9, 9);

    if (a === d) return makeProblem();

    A = a;
    B = a*b+c;
    C = d;
    k = (A-C)*root+B-d*e;
    D = d*e+k;

    left = appendConstant(
      multiplied(a,parentheses(b)),c
    );
    right = appendConstant(
      multiplied(d,parentheses(e)),k
    );
  }

  // Type 4: Two distributive terms
  else if (type === 4) {
    a = nonzero(-6, 6);
    b = nonzero(-8, 8);
    c = nonzero(-6, 6);
    d = nonzero(-8, 8);

    A = a+c;
    if (A === 0) return makeProblem();
    B = a*b+c*d;
    C = 0;
    D = A*root+B;

    left = multiplied(a,parentheses(b)) +
      (c < 0 ? "-" : "+") +
      multiplied(Math.abs(c),parentheses(d));
    right = String(D);
  }

  // Type 5: Distribute on both sides, combine terms
  else {
    a = nonzero(-6, 6);
    b = nonzero(-8, 8);
    c = nonzero(-6, 6);
    d = nonzero(-8, 8);
    e = nonzero(-7, 7);
    f = nonzero(-8, 8);

    A = a+c;
    C = e;
    if (A === C) return makeProblem();

    B = a*b+c*d;
    k = (A-C)*root+B-e*f;
    D = e*f+k;

    left = multiplied(a,parentheses(b)) +
      (c < 0 ? "-" : "+") +
      multiplied(Math.abs(c),parentheses(d));
    right = appendConstant(
      multiplied(e,parentheses(f)),k
    );
  }

  const equation = left + "=" + right;
  const difference = A-C;
  const remaining = D-B;

  const steps = [
    {
      label: "Distribute and combine like terms.",
      tex: linear(A,B) + "=" + linear(C,D)
    },
    {
      label: "Move variable terms to the left.",
      tex: linear(difference,B) + "=" + D
    },
    {
      label: "Move constants to the right.",
      tex: xTerm(difference,true) + "=" + remaining
    },
    {
      label: "Divide by " + difference + ".",
      tex: "x=" + root
    }
  ];

  return { equation, answer: root, steps };
}

function math(s) {
  return "\\(" + s + "\\)";
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(console.error);
  }
}

function clearMath() {
  if (window.MathJax && MathJax.typesetClear) {
    MathJax.typesetClear([$("equation"),$("solution")]);
  }
}

function newProblem() {
  let next;
  let attempts = 0;

  do {
    next = makeProblem();
    attempts++;
  } while (
    next.equation === previousEquation &&
    attempts < 30
  );

  clearMath();

  problem = next;
  previousEquation = next.equation;
  showingSolution = false;

  $("equation").style.display = "block";
  $("solution").style.display = "none";
  $("equation").innerHTML = math(problem.equation);
  $("solution").innerHTML = "";

  $("solutionBtn").textContent = "Show Solution";
  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  typeset();
}

function checkAnswer() {
  const value = $("answer").value.trim();
  const feedback = $("feedback");

  if (!/^[+-]?\d+$/.test(value)) {
    feedback.textContent = "Enter an integer answer.";
    feedback.className = "feedback incorrect";
    return;
  }

  const answer = Number(value);

  if (!Number.isSafeInteger(answer)) {
    feedback.textContent = "Enter a valid integer.";
    feedback.className = "feedback incorrect";
    return;
  }

  if (answer === problem.answer) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
  } else {
    feedback.textContent = "Not quite. Try again.";
    feedback.className = "feedback incorrect";
  }
}

function toggleSolution() {
  showingSolution = !showingSolution;

  if (showingSolution) {
    clearMath();

    $("equation").style.display = "none";
    $("solution").style.display = "block";

    let html =
      '<div class="solution-title">Step-by-step solution</div>' +
      '<div class="solution-step">' +
      math(problem.equation) + '</div>';

    for (const step of problem.steps) {
      html +=
        '<div class="solution-label">' +
        step.label + '</div>' +
        '<div class="solution-step">' +
        math(step.tex) + '</div>';
    }

    $("solution").innerHTML = html;
    $("solutionBtn").textContent = "Hide Solution";
    typeset();
  } else {
    $("equation").style.display = "block";
    $("solution").style.display = "none";
    $("solutionBtn").textContent = "Show Solution";
  }
}

function toggleTheme() {
  const light = document.body.classList.toggle("light");

  document.getElementById("themeBtn").textContent =
    light ? "☾ Dark mode" : "☀ Light mode";
}

$("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkAnswer();
});

newProblem();
</script>
</body>
</html>
